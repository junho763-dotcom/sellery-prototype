<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>셀러리 프로토타입</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20stroke%3D%22%23141414%22%20stroke-width%3D%221.5%22%3E%3Ccircle%20cx%3D%226.5%22%20cy%3D%225.5%22%20r%3D%223%22%20fill%3D%22%239cc86a%22%2F%3E%3Ccircle%20cx%3D%2217.5%22%20cy%3D%225.5%22%20r%3D%223%22%20fill%3D%22%239cc86a%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%224.4%22%20r%3D%223.4%22%20fill%3D%22%236da33a%22%2F%3E%3Crect%20x%3D%224.6%22%20y%3D%228.2%22%20width%3D%224.2%22%20height%3D%2212.8%22%20rx%3D%222.1%22%20fill%3D%22%23cfe3a4%22%2F%3E%3Crect%20x%3D%2215.2%22%20y%3D%228.2%22%20width%3D%224.2%22%20height%3D%2212.8%22%20rx%3D%222.1%22%20fill%3D%22%23cfe3a4%22%2F%3E%3Crect%20x%3D%229.9%22%20y%3D%227.4%22%20width%3D%224.2%22%20height%3D%2213.6%22%20rx%3D%222.1%22%20fill%3D%22%23aed378%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@500;600;700;800;900&display=swap">
<style>
/* SELLERY — neo-brutalist editorial skin (single committed theme) */
:root{
  --bg:#efede2;
  --surface:#fdfcf6;
  --surface-2:#e6e3d4;
  --ink:#141414;
  --mute:#6d6a5c;
  --line:#141414;
  --soft-line:#d6d3c2;
  --red:#457c28; /* brand accent — warm celery-leaf green, tuned to the cream ground */
  --red-soft:#e8efda;
  --yellow:#f7df3e;
  --yellow-soft:#faf3c4;
  --money:#8f6400;
  --money-soft:#f5ecc9;
  --danger:#e03131;
  --danger-soft:#fbe3e0;
  --info:#2757a8;
  --info-soft:#e2ebf9;
  --brand-c:#2757a8; --brand-bg:#e2ebf9;
  --seller-c:#c02467; --seller-bg:#fbe0ec;
  --plat-c:#2f7d32; --plat-bg:#e2f0dd;
  --hs:4px 4px 0 var(--ink);
  --hs-sm:3px 3px 0 var(--ink);
  --hs-red:4px 4px 0 var(--red);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;cursor:pointer;
  border:2px solid var(--ink);border-radius:4px;padding:9px 16px;
  background:var(--surface);color:var(--ink);font-weight:700;letter-spacing:.02em;
  box-shadow:var(--hs-sm);transition:transform .12s ease,box-shadow .12s ease}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--ink);color:var(--surface);box-shadow:var(--hs-red)}
button.pri:hover{box-shadow:5px 5px 0 var(--red)}
button.pri:active{box-shadow:1px 1px 0 var(--red)}
button.ghost{background:transparent}
button.danger{background:var(--red);color:#fff;box-shadow:var(--hs-sm)}
button.sm{padding:6px 12px;font-size:11.5px}
button[disabled]{cursor:not-allowed;opacity:.45;transform:none!important;box-shadow:var(--hs-sm)!important}
input,select,textarea{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:13px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:9px 12px;width:100%}
textarea{resize:vertical;font-family:'IBM Plex Sans KR',sans-serif}
:focus{outline:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== app bar ===== */
.appbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:22px;padding:12px 24px;flex-wrap:wrap}
.wordmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;white-space:nowrap;
  background:var(--surface);border:2px solid var(--ink);box-shadow:var(--hs-red);padding:5px 16px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px}
.wordmark svg{flex-shrink:0;transform:rotate(-4deg)}
.wordmark .dot{color:var(--red);font-style:normal}
.roletabs{display:flex;gap:8px}
.roletabs button{background:transparent;border:2px solid transparent;box-shadow:none;color:var(--mute);
  padding:6px 12px;font-size:12px;letter-spacing:.08em;position:relative;text-transform:uppercase}
.roletabs button:hover{color:var(--ink);transform:none;box-shadow:none}
.roletabs button.on{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:var(--hs-sm)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  border:1.5px solid var(--ink);border-radius:999px;min-width:17px;height:17px;line-height:14px;padding:0 4px;text-align:center}
.master{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.master .chip-master{background:var(--ink);color:var(--yellow);font-weight:700;font-size:10px;letter-spacing:.12em;padding:4px 12px;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.master button{box-shadow:none;border-width:1.5px}
.master button:hover{transform:none;box-shadow:var(--hs-sm)}

/* ===== ticker ===== */
.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--ink)}
.ticker .tk{display:inline-block;padding:7px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;animation:tick 28s linear infinite}
.ticker em{font-style:italic;color:var(--yellow);letter-spacing:.05em}
.ticker .sp{color:var(--red);margin:0 18px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker .tk{animation:none}}

/* ===== sub nav ===== */
.subnav{display:flex;gap:8px;padding:16px 24px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap;align-items:center}
.subnav button{background:transparent;border:2px solid var(--ink);box-shadow:none;padding:6px 14px;font-size:12px;color:var(--ink)}
.subnav button:hover{box-shadow:var(--hs-sm)}
.subnav button.on{background:var(--ink);color:var(--bg);box-shadow:var(--hs-red)}
.persona{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.persona select{width:auto;padding:5px 8px;font-size:12px}

main{max-width:1200px;margin:0 auto;padding:26px 24px 90px}
h2.pg{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:30px;font-weight:800;margin:8px 0 22px;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h2.pg small{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px;color:var(--mute);font-weight:400;margin-left:12px;letter-spacing:0;text-transform:none}

/* ===== hero band ===== */
.hero-band{position:relative;background:var(--bg);padding:34px 4px 58px;margin-bottom:-30px}
.hero-band .ey{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--red);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.hero-band .ey::before{content:'→ ';font-weight:400}
.hero-band h1{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:clamp(26px,4.4vw,44px);font-weight:800;margin:0;line-height:1.32;letter-spacing:-.015em;text-wrap:balance}
.hero-band h1 em{font-style:normal;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:0 8px;display:inline-block;transform:rotate(-.6deg)}
.hero-band .sub{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;color:var(--mute);margin-top:12px}
.hero-band .sub b{color:var(--ink)}
.overlap{position:relative;z-index:2}
main > *{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
main > *:nth-child(2){animation-delay:.04s}
main > *:nth-child(3){animation-delay:.08s}
main > *:nth-child(4){animation-delay:.12s}
main > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== category chips ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.catchip{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:6px 14px;font-size:12px;color:var(--ink);font-weight:700;box-shadow:none;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.catchip:hover{box-shadow:var(--hs-sm)}
.catchip.on{background:var(--yellow);box-shadow:var(--hs-sm)}

/* ===== cards & grids ===== */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:var(--hs)}
.kpi .lbl{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.kpi .val{font-family:'Archivo',sans-serif;font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--mute);margin-top:3px}
.sec{margin:36px 0 14px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.sec::before{content:'';width:10px;height:10px;background:var(--red)}
.sec::after{content:'';flex:1;height:2px;background:var(--ink)}
.lbl-sm{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700}

/* ===== chips ===== */
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;vertical-align:middle;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.chip.brand{color:var(--brand-c);background:var(--brand-bg)}
.chip.seller{color:var(--seller-c);background:var(--seller-bg)}
.chip.plat{color:var(--plat-c);background:var(--plat-bg)}
.chip.auto{color:var(--mute);background:var(--surface-2)}
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.st.gray{background:var(--surface-2);color:var(--mute)}
.st.blue{background:var(--info-soft);color:var(--info)}
.st.green{background:var(--plat-bg);color:var(--plat-c)}
.st.amber{background:var(--yellow-soft);color:var(--money)}
.st.red{background:var(--danger-soft);color:var(--danger)}
.st.live{background:var(--red);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
.gradebox{display:inline-block;font-family:'Archivo',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 10px;background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.gradebox.sm{font-size:9.5px;padding:2px 7px;box-shadow:1.5px 1.5px 0 var(--ink)}
.meter{height:14px;border:2px solid var(--ink);background:var(--surface);position:relative}
.meter span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--yellow),var(--yellow) 8px,var(--ink) 8px,var(--ink) 10px)}

/* ===== tables ===== */
.tblw{overflow-x:auto;background:var(--surface);border:2px solid var(--ink);border-radius:6px;box-shadow:var(--hs)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--ink);font-weight:700;background:var(--yellow-soft);padding:10px 16px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--soft-line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--yellow-soft)}
tr.merow td{background:var(--yellow-soft);font-weight:700}

/* ===== product cards ===== */
.prod{display:flex;flex-direction:column;gap:9px;transition:transform .14s ease,box-shadow .14s ease}
.prod:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.prod .ph{height:128px;border:2px solid var(--ink);background:var(--surface-2);
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 14px,rgba(20,20,20,.045) 14px,rgba(20,20,20,.045) 28px);
  display:flex;align-items:center;justify-content:center;font-size:44px;transform:rotate(-1.2deg);box-shadow:var(--hs-sm)}
.grid > .prod:nth-child(even) .ph{transform:rotate(1deg)}
.prod .nm{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase}
.prod .meta{font-size:12px;color:var(--mute)}
.prod .prices{display:flex;align-items:baseline;gap:8px}
.prod .gp{font-family:'Archivo',sans-serif;font-size:19px;font-weight:800}
.prod .cp{font-size:12px;color:var(--mute);text-decoration:line-through}
.prod .rate{font-size:10.5px;font-weight:800;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px;font-family:'IBM Plex Mono',monospace}

/* ===== campaign detail ===== */
.det-head{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;box-shadow:var(--hs)}
.det-head .t{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:19px;font-weight:800;text-transform:uppercase}
.det-body{display:grid;grid-template-columns:1fr 350px;gap:18px;margin-top:18px;align-items:start}
@media(max-width:900px){.det-body{grid-template-columns:1fr}}

/* ===== thread ===== */
.thread{background:var(--surface);border:2px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;min-height:440px;box-shadow:var(--hs)}
.thread .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:540px}
.msg{max-width:78%;padding:9px 13px;border:1.5px solid var(--ink);border-radius:4px;font-size:13.5px;background:var(--surface-2);box-shadow:2px 2px 0 var(--ink)}
.msg .who{font-size:10.5px;font-weight:800;margin-bottom:2px;letter-spacing:.04em;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.msg.seller{align-self:flex-start;background:var(--seller-bg)}
.msg.brand{align-self:flex-end;background:var(--brand-bg)}
.msg .tm{font-size:10.5px;color:var(--mute);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.sysline{align-self:center;font-size:11.5px;color:var(--mute);background:var(--bg);border:1.5px dashed var(--mute);border-radius:3px;padding:4px 14px;text-align:center}
.sysline b{color:var(--ink)}
.warnline{align-self:center;font-size:11.5px;color:#fff;background:var(--danger);border:1.5px solid var(--ink);border-radius:3px;padding:6px 13px;text-align:center;max-width:90%;box-shadow:2px 2px 0 var(--ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:2px solid var(--ink)}
.composer .as{font-size:10.5px;color:var(--mute);white-space:nowrap;align-self:center;font-weight:700;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.composer button{white-space:nowrap}

/* ===== action panel ===== */
.actions .card{margin-bottom:16px}
.actions h4{margin:0 0 8px;font-size:13.5px;font-weight:800}
.actions .hint{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.sim{border:2px dashed var(--ink);background:var(--yellow-soft);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.sim h4{margin:0 0 4px;font-size:10.5px;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.sim p{font-size:11.5px;color:var(--mute);margin:0 0 10px}

/* ===== stepper ===== */
.stepper{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
.stp{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;padding:3px 8px;border:1.5px solid var(--soft-line);background:var(--surface);color:var(--mute);white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stp.done{background:var(--yellow-soft);border-color:var(--ink);color:var(--ink)}
.stp.now{background:var(--ink);border-color:var(--ink);color:var(--yellow)}

/* ===== calendar slots ===== */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;background:var(--surface-2);border:1.5px solid var(--ink);border-radius:3px;padding:8px 13px}
.slot .rng{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700}

/* ===== list rows ===== */
.rowitem{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--soft-line);cursor:pointer;flex-wrap:wrap;transition:background .1s}
.rowitem:last-child{border-bottom:none}
.rowitem:hover{background:var(--yellow-soft)}
.rowitem .grow{flex:1;min-width:180px}
.rowitem .nm{font-weight:800;font-size:14px}
.rowitem .sub{font-size:12px;color:var(--mute)}
.listcard{background:var(--surface);border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.empty{padding:32px;text-align:center;color:var(--mute);font-size:13px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}

/* ===== modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:6px;max-width:530px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:8px 8px 0 var(--ink);animation:min .16s ease}
@keyframes min{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px;font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);margin-bottom:5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ===== buyer landing ===== */
.landing{border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.landing .hero{background:var(--yellow);padding:34px 22px 26px;text-align:center;position:relative;border-bottom:2px solid var(--ink)}
.landing .hero::after{content:'LIMITED RUN';position:absolute;top:12px;left:50%;transform:translateX(-50%) rotate(-2deg);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.3em;color:#fff;background:var(--red);border:1.5px solid var(--ink);padding:2px 10px;font-weight:700}
.landing .hero .em{font-size:52px;display:block;margin-top:14px}
.landing .hero h3{font-family:'Archivo','IBM Plex Sans KR',sans-serif;margin:10px 0 3px;font-size:22px;font-weight:800;text-transform:uppercase}
.landing .hero .by{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;color:var(--ink)}
.landing .body{padding:20px 22px;background:var(--surface)}
.landing .pr{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-bottom:6px}
.landing .pr .g{font-family:'Archivo',sans-serif;font-size:31px;font-weight:800}
.landing .pr .c{color:var(--mute);text-decoration:line-through;font-size:13px}
.landing .timer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--danger);font-weight:700;margin-bottom:14px;letter-spacing:.04em}
.landing .buy{width:100%;padding:14px;font-size:14px}

/* ===== toast ===== */

/* ============ state ============ */

const GRADES=[
  {g:'ELITE',min:50000000,bonus:2,perk:'수수료 +2%p · 스카우트 최상단 · 전담 매니저'},
  {g:'POWER',min:20000000,bonus:1,perk:'수수료 +1%p · 신상품 우선 제안권'},
  {g:'RISING',min:5000000,bonus:0.5,perk:'수수료 +0.5%p · 샘플 요청 한도 확대'},
  {g:'PARTNER',min:0,bonus:0,perk:'기본 수수료율'}
];
const gradeOf=m=>GRADES.find(t=>m>=t.min);
let S;
function load(){
  let d=null;
  try{const raw=localStorage.getItem(LS); if(raw) d=JSON.parse(raw);}catch(e){}
  S={view:{role:'seller',screen:'home',cid:null},actingSeller:'s1',actingBrand:'b1',data:d||seedData()};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S.data));}catch(e){}}
load();
let liveTimer=null;
function dlCSV(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}

/* ============ helpers ============ */
const D_ = () => S.data;
const prod = id => D_().products.find(p=>p.id===id);
const brand = id => D_().brands.find(b=>b.id===id);
const seller = id => D_().sellers.find(s=>s.id===id);
const camp = id => D_().campaigns.find(c=>c.id===id);
const campOrders = cid => D_().orders.filter(o=>o.campaignId===cid);
function calc(c){
  const os=campOrders(c.id);
  const gross=os.filter(o=>o.status!=='CANCELED').reduce((a,o)=>a+o.unit*o.qty,0);
  const refund=os.filter(o=>o.status==='REFUNDED').reduce((a,o)=>a+o.unit*o.qty,0);
  const net=gross-refund;
  const p=prod(c.productId);
  const pg=net*PG_RATE, sf=net*p.rate, pf=net*PLAT_RATE;
  return {gross,refund,net,pg,sf,pf,brandPay:net-pg-sf-pf,paidCnt:os.filter(o=>o.status==='PAID').length,refCnt:os.filter(o=>o.status==='REFUNDED').length};
}
function settleDue(c){ return addD(P(c.end),CLEAR_DAYS); }
function pushSys(cid,txt){(D_().messages[cid]=D_().messages[cid]||[]).push({type:'sys',txt,at:ymd(today())});}
function pushChat(cid,role,txt){
  const msgs=D_().messages[cid]=D_().messages[cid]||[];
  msgs.push({type:'chat',role,txt,at:ymd(today())});
  if(/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}|카톡|카카오톡|kakao/i.test(txt)){
    msgs.push({type:'warn',txt:'⚠ 연락처/외부 메신저 공유가 감지되었습니다. 플랫폼 밖 거래는 정산·분쟁 보호를 받지 못합니다.',at:ymd(today())});
  }
}
function toast(t){
  const el=document.createElement('div');el.className='toast';el.textContent=t;
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),2600);
}
function overlaps(pid,s,e,exceptCid){
  return D_().campaigns.some(c=>c.productId===pid&&c.id!==exceptCid&&['SCHEDULE_CONFIRMED','LIVE'].includes(c.status)
    &&!(P(e)<P(c.start)||P(s)>P(c.end)));
}
/* pending counts for badges */
function counts(){
  const cs=D_().campaigns;
  return {
    seller: cs.filter(c=>['SAMPLE_SHIPPED','TESTING'].includes(c.status)).length,
    brand: cs.filter(c=>['SAMPLE_REQUESTED','SCHEDULE_PROPOSED','SAMPLE_APPROVED'].includes(c.status)).length,
    admin: D_().products.filter(p=>p.status==='pending').length + cs.filter(c=>c.status==='CLEARING'&&settleDue(c)<=today()).length
  };
}

  admin:[['home','대시보드'],['review','상품 검수'],['settle','정산 실행']]
};
function render(){
  const cnt=counts();
  $('#roletabs').innerHTML=ROLES.map(([k,l])=>
    `<button data-act="role" data-k="${k}" class="${S.view.role===k?'on':''}">${l}${cnt[k]?`<span class="badge">${cnt[k]}</span>`:''}</button>`).join('');

    personaHtml=`<div class="persona">접속 셀러 <select data-act="setSeller">${D_().sellers.map(s=>`<option value="${s.id}" ${s.id===S.actingSeller?'selected':''}>${s.name} ${s.handle}</option>`).join('')}</select></div>`;
  } else if(S.view.role==='brand'){
    personaHtml=`<div class="persona">접속 브랜드 <select data-act="setBrand">${D_().brands.map(b=>`<option value="${b.id}" ${b.id===S.actingBrand?'selected':''}>${b.name}</option>`).join('')}</select></div>`;
  }
  $('#subnav').innerHTML=scr.map(([k,l])=>
    `<button data-act="screen" data-k="${k}" class="${S.view.screen===k&&!S.view.cid?'on':''}">${l}</button>`).join('')+personaHtml;
  const m=$('#main');
  if(S.view.cid){ m.innerHTML=vCampDetail(S.view.cid); const box=m.querySelector('.msgs'); if(box) box.scrollTop=box.scrollHeight; return; }
  const fn={
    'seller.home':vSellerHome,'seller.explore':vExplore,'seller.camps':vSellerCamps,'seller.sales':vSales,'seller.rank':vRank,'seller.settle':vSellerSettle,
    'brand.home':vBrandHome,'brand.products':vBrandProducts,'brand.gallery':vGallery,'brand.requests':vRequests,'brand.sales':vSales,'brand.orders':vBrandOrders,'brand.settle':vBrandSettle,
    'admin.home':vAdminHome,'admin.review':vAdminReview,'admin.settle':vAdminSettle
  }[S.view.role+'.'+S.view.screen]||vSellerHome;
  m.innerHTML=fn();
}

/* ============ shared components ============ */
function stChip(st){const m=ST[st];return `<span class="st ${m.c}">${st==='LIVE'?'<span class="pulse"></span>':''}${m.l}</span>`;}
function stepper(status){
  const idx=FLOW.indexOf(status);
  return `<div class="stepper">${FLOW_L.map((l,i)=>`<span class="stp ${i<idx?'done':i===idx?'now':''}">${l}</span>`).join('')}</div>`;
}
function campRow(c,{who='seller'}={}){
  const p=prod(c.productId),b=brand(p.brandId),s=seller(c.sellerId);
  const sub = who==='seller' ? `${b.name} · 수수료 ${(p.rate*100).toFixed(0)}%` : `${s.name} ${s.handle} · 팔로워 ${fmt(s.followers)}`;
  const when=c.start?`<span class="sub" style="font-family:'IBM Plex Mono',monospace">${md(P(c.start))}–${md(P(c.end))}</span>`:'';
  return `<div class="rowitem" data-act="open" data-k="${c.id}">
    <div style="font-size:24px">${p.em}</div>
    <div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">${sub}</div></div>
    ${when} ${stChip(c.status)}</div>`;
}

/* ============ LIVE SALES (seller + brand shared) ============ */
function vSales(){
  let cs;
  if(S.view.role==='seller') cs=D_().campaigns.filter(c=>c.sellerId===S.actingSeller&&c.status==='LIVE');
  else {const myP=D_().products.filter(p=>p.brandId===S.actingBrand).map(p=>p.id);cs=D_().campaigns.filter(c=>myP.includes(c.productId)&&c.status==='LIVE');}
  const t=ymd(today());
  const head=`<h2 class="pg">실시간 매출 <small>LIVE 공구의 판매 현황 — 주문이 들어오면 즉시 반영</small></h2>
  <div style="margin-bottom:16px"><button class="${liveTimer?'danger':'pri'}" data-act="toggleLive">${liveTimer?'⏸ 실시간 판매 시뮬레이션 중지':'▶ 실시간 판매 시뮬레이션 시작'}</button>
  <span style="font-size:12px;color:var(--mute);margin-left:10px">실서비스에선 결제 웹훅으로 자동 반영됩니다</span></div>`;
  if(!cs.length) return head+`<div class="listcard"><div class="empty">지금 LIVE 상태인 공구가 없습니다 — 캠페인을 시작해보세요</div></div>`;
  return head+cs.map(c=>{
    const p=prod(c.productId),s=seller(c.sellerId),k=calc(c);
    const os=campOrders(c.id);
    const todayOs=os.filter(o=>o.at===t&&o.status==='PAID');
    const todayRev=todayOs.reduce((a,o)=>a+o.unit*o.qty,0);
    const visits=Math.round((k.paidCnt+k.refCnt)*17.3);
    const conv=visits?((k.paidCnt+k.refCnt)/visits*100).toFixed(1):'0.0';
    // last 7 days bars
    const days=[...Array(7)].map((_,i)=>{const d=ymd(addD(today(),i-6));
      const rev=os.filter(o=>o.at===d&&o.status!=='CANCELED').reduce((a,o)=>a+o.unit*o.qty,0);
      return {d,rev};});
    const mx=Math.max(...days.map(x=>x.rev),1);
    const feed=os.slice(-10).reverse();
    return `<div class="sec">${esc(p.name)} · ${s.handle} <span class="st live" style="margin-left:4px"><span class="pulse"></span>LIVE</span></div>
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">오늘 매출</div><div class="val">₩${fmt(todayRev)}</div><div class="sub">주문 ${todayOs.length}건</div></div>
      <div class="card kpi"><div class="lbl">누적 확정 매출</div><div class="val">₩${fmt(k.net)}</div><div class="sub">결제 ${k.paidCnt}건 · 환불 ${k.refCnt}건</div></div>
      <div class="card kpi"><div class="lbl">${S.view.role==='seller'?'내 수수료 (실시간)':'브랜드 정산액 (실시간)'}</div><div class="val" style="color:var(--money)">₩${fmt(S.view.role==='seller'?k.sf*(1-WHT):k.brandPay)}</div><div class="sub">${S.view.role==='seller'?'원천징수 후 예상':'수수료 차감 후 예상'}</div></div>
      <div class="card kpi"><div class="lbl">방문 → 구매 전환</div><div class="val">${conv}%</div><div class="sub">방문 ${fmt(visits)}회 (추정)</div></div>
    </div>
    <div class="livegrid" style="margin-top:16px">
      <div class="card"><h4 style="margin:0 0 4px;font-size:13px">최근 7일 매출</h4>
        <div class="barwrap"><div class="bars">${days.map(x=>`<div class="b" style="height:${Math.max(3,x.rev/mx*100)}%"><span class="bl">${x.rev?'₩'+fmt(Math.round(x.rev/1000))+'k':''}</span><span class="bd">${md(P(x.d))}</span></div>`).join('')}</div></div>
      </div>
      <div class="card" style="padding:0"><h4 style="margin:0;padding:14px 16px 8px;font-size:13px">주문 피드</h4>
        <div class="feed">${feed.map(o=>`<div class="rowitem"><div class="grow"><span style="font-weight:600">${o.buyer}</span> <span class="sub">${o.qty}개 · ${md(P(o.at))}</span></div><span class="num" style="font-family:'IBM Plex Mono',monospace">₩${fmt(o.unit*o.qty)}</span>${o.status==='REFUNDED'?'<span class="st red">환불</span>':''}</div>`).join('')||'<div class="empty">아직 주문 없음</div>'}</div>
      </div>
    </div>
    <div style="margin-top:12px"><button class="sm ghost" data-act="open" data-k="${c.id}">캠페인 상세 →</button></div>`;
  }).join('');
}

          <tr><td><b>확정 매출</b></td><td class="num"><b>₩${fmt(k.net)}</b></td></tr>

function detActions(c,k,p,s,linkUrl){
  const A=[];
  const card=(h,hint,btns)=>`<div class="card"><h4>${h}</h4><p class="hint">${hint}</p><div class="btnrow">${btns}</div></div>`;
  const sim=(h,hint,btns)=>`<div class="sim" style="margin-bottom:12px"><h4>⏱ ${h}</h4><p>${hint}</p><div class="btnrow">${btns}</div></div>`;
  switch(c.status){
    case 'SAMPLE_REQUESTED':
      A.push(card('샘플 요청 검토 <span class="chip brand">브랜드 액션</span>',
        `${s.name} ${s.handle} · 팔로워 ${fmt(s.followers)} · 등급 ${s.grade}. 승인 시 배송지가 브랜드에 전달됩니다.`,
        `<button class="pri" data-act="approveSample" data-k="${c.id}">승인</button>
         <button class="danger" data-act="rejectSample" data-k="${c.id}">거절</button>`));
      break;
    case 'SAMPLE_APPROVED':
      A.push(card('샘플 발송 <span class="chip brand">브랜드 액션</span>','운송장 번호를 입력하면 배송 추적이 시작됩니다.',
        `<input id="trackIn" placeholder="운송장 번호 (예: 6890-1234-5678)" style="margin-bottom:8px">
         <button class="pri" data-act="shipSample" data-k="${c.id}">발송 처리</button>`));
      break;
    case 'SAMPLE_SHIPPED':
      A.push(card('샘플 수령 확인 <span class="chip seller">셀러 액션</span>',`운송장 ${c.tracking||'—'} · 수령 확인 시 테스트 기한 14일이 시작됩니다.`,
        `<button class="pri" data-act="receiveSample" data-k="${c.id}">수령 확인</button>`));
      break;
    case 'TESTING':
      A.push(card('테스트 후 진행 결정 <span class="chip seller">셀러 액션</span>',
        `기한 ${c.testDue?md(P(c.testDue)):'—'} 까지. 진행 시 공구 일정을 제안합니다.`,
        `<button class="pri" data-act="openSchedule" data-k="${c.id}">진행할게요 → 일정 제안</button>
         <button data-act="passCamp" data-k="${c.id}">이번엔 패스</button>`));
      break;
    case 'SCHEDULE_PROPOSED':
      A.push(card('일정 승인 <span class="chip brand">브랜드 액션</span>',
        `제안 기간: <b>${md(P(c.propStart))} – ${md(P(c.propEnd))}</b> · 배정 재고 ${fmt(c.propQty)}개. 승인 시 이 기간이 캘린더에 잠깁니다(기간 독점).`,
        `<button class="pri" data-act="confirmSchedule" data-k="${c.id}">일정 승인</button>
         <button class="danger" data-act="rejectSchedule" data-k="${c.id}">반려 (재제안 요청)</button>`));
      break;
    case 'SCHEDULE_CONFIRMED':{
      const dday=Math.ceil((P(c.start)-today())/DAY);
      A.push(card('공구 대기 중',`시작 ${md(P(c.start))} (D-${Math.max(dday,0)}) — 시작 시각에 링크가 자동 활성화됩니다.`,''));
      A.push(sim('시뮬레이션','실서비스에선 스케줄러가 자동 처리합니다.',
        `<button class="sm" data-act="goLive" data-k="${c.id}">공구 시작 처리</button>`));
      break;}
    case 'LIVE':
      A.push(card('공구 링크 <span class="st live"><span class="pulse"></span>LIVE</span>',
        `<code style="font-size:11.5px">${linkUrl}</code> · 종료 ${md(P(c.end))}`,
        `<button class="pri" data-act="preview" data-k="${c.id}">전시장(구매 페이지) 미리보기</button>
         <button data-act="copyLink" data-k="${linkUrl}">링크 복사</button>`));
      A.push(sim('판매 시뮬레이션','구매자 주문을 흉내내 정산 숫자가 움직이는 걸 확인하세요.',
        `<button class="sm" data-act="simOrders" data-k="${c.id}">주문 +5건</button>
         <button class="sm" data-act="simOrders20" data-k="${c.id}">주문 +20건</button>
         <button class="sm" data-act="endCamp" data-k="${c.id}">공구 종료 처리</button>`));
      break;
    case 'CLEARING':{
      const due=settleDue(c);
      A.push(card('교환·환불 처리 기간',
        `종료 ${md(P(c.end))} → 정산 기준일 <b>${md(due)}</b> (D+${CLEAR_DAYS}). 이 기간의 환불은 정산액에서 차감됩니다. 정산 실행은 관리자 탭에서.`,''));
      A.push(sim('시뮬레이션','',`<button class="sm" data-act="ffwd" data-k="${c.id}">⏩ 3주 경과 처리</button>`));
      break;}
    case 'SETTLED':
      A.push(card('정산 완료 ✓',`셀러 지급 ₩${fmt(k.sf*(1-WHT))} (원천징수 후) · 브랜드 지급 ₩${fmt(k.brandPay)}. 성과가 좋았다면 같은 조합으로 바로 재공구를 열 수 있습니다.`,
        `<button class="pri" data-act="regongu" data-k="${c.id}">🔁 재공구 제안 (샘플 생략)</button>
         <button data-act="settleCSV">명세 CSV</button>`));
      break;
    case 'REJECTED': A.push(card('거절된 요청','브랜드가 이번 요청을 승인하지 않았습니다.','')); break;
    case 'PASSED': A.push(card('셀러 패스','셀러가 테스트 후 진행하지 않기로 했습니다.','')); break;
  }
  return A.join('');
}

/* ============ actions ============ */
function transition(cid,st,sysTxt){const c=camp(cid);c.status=st;if(sysTxt)pushSys(cid,sysTxt);save();render();}
const ACT={
  role(k){S.view={role:k,screen:'home',cid:null};render();},
  screen(k){S.view.screen=k;S.view.cid=null;render();},
  open(k){S.view.cid=k;render();},
  back(){S.view.cid=null;render();},
  setSeller(k,el){S.actingSeller=el.value;render();},
  setBrand(k,el){S.actingBrand=el.value;render();},
  setCat(k){S.catFilter=k;render();},
  reset(){if(confirm('시드 데이터로 초기화할까요? 테스트 중 만든 데이터가 사라집니다.')){try{localStorage.removeItem(LS);}catch(e){};S.data=seedData();save();S.view.cid=null;render();toast('초기화 완료');}},
  closeModal(){closeModal();},

  reqSample(pid){
    const id='c'+(D_().seq++);
    D_().campaigns.push({id,sellerId:S.actingSeller,productId:pid,status:'SAMPLE_REQUESTED',createdAt:ymd(today())});
    const s=seller(S.actingSeller);
    pushSys(id,`셀러 <b>${s.name}(${s.handle})</b>가 샘플을 요청했습니다`);
    save();S.view={role:'seller',screen:'camps',cid:id};render();toast('샘플 요청 완료 — 브랜드 승인 대기');
  },
  invite(sid){inviteModal(sid);},
  unlockRef(sid){
    (D_().unlockedRefs=D_().unlockedRefs||[]).push(sid);
    save();render();toast('레퍼런스 열람권 결제 완료 (시뮬레이션) — 상세 지표가 공개되었습니다');
  },
  confirmInvite(sid){
    const pid=$('#invProd').value;const msg=$('#invMsg').value.trim();
    const id='c'+(D_().seq++);
    D_().campaigns.push({id,sellerId:sid,productId:pid,status:'SAMPLE_APPROVED',createdAt:ymd(today())});
    pushSys(id,`브랜드 <b>${brand(S.actingBrand).name}</b>가 <b>${prod(pid).name}</b> 공구를 직접 제안했고, 셀러가 수락했습니다 (프로토타입 자동 수락)`);
    if(seller(sid).hidden)pushSys(id,`🔓 익명 셀러가 제안을 수락해 신원이 공개되었습니다 — <b>${seller(sid).name} ${seller(sid).handle}</b>. 지금부터 이 스레드(DM)로 소통하세요`);
    if(msg)pushChat(id,'brand',msg);
    closeModal();save();S.view.cid=id;render();toast(`${seller(sid).name}님에게 제안 발송 → 수락됨`);
  },
  toggleLive(){
    if(liveTimer){clearInterval(liveTimer);liveTimer=null;toast('실시간 시뮬레이션 중지');render();return;}
    liveTimer=setInterval(()=>{
      const ls=D_().campaigns.filter(c=>c.status==='LIVE');
      if(!ls.length)return;
      if(Math.random()<.8){
        const c=ls[Math.floor(Math.random()*ls.length)];
        const p=prod(c.productId);
        const names=['김*은','이*아','박*희','최*진','정*수','한*별','윤*서','장*미'];
        D_().orders.push({id:'o'+(D_().seq++),campaignId:c.id,buyer:names[Math.floor(Math.random()*8)],qty:Math.random()<.2?2:1,unit:p.gp,status:'PAID',at:ymd(today())});
        save();
        const ae=document.activeElement;
        if(!(ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName))&&!document.querySelector('.modal-bg'))render();
      }
    },3500);
    toast('실시간 판매 시뮬레이션 시작 — 3~4초마다 주문 발생');render();
  },
  poCSV(){
    const myP=D_().products.filter(p=>p.brandId===S.actingBrand).map(p=>p.id);
    const cids=D_().campaigns.filter(c=>myP.includes(c.productId)).map(c=>c.id);
    const os=D_().orders.filter(o=>cids.includes(o.campaignId));
    const rows=[['주문번호','일자','상품','셀러','구매자','수량','단가','금액','상태']];
    os.forEach(o=>{const c=camp(o.campaignId),p=prod(c.productId);
      rows.push([o.id.toUpperCase(),o.at,p.name,seller(c.sellerId).handle,o.buyer,o.qty,o.unit,o.unit*o.qty,o.status==='PAID'?'결제완료':'환불']);});
    dlCSV(`발주서_${brand(S.actingBrand).name}_${ymd(today())}.csv`,rows);
    toast(`발주서 CSV 다운로드 — 주문 ${os.length}건`);
  },
  poEmail(){
    const po=D_().autoPO||{};
    const email=($('#poEmailIn')&&$('#poEmailIn').value.trim())||po.email||'logistics@brand.co';
    toast(`✉ 발주서가 ${email}(으)로 발송되었습니다 (시뮬레이션)`);
  },
  saveAutoPO(){
    const email=$('#poEmailIn').value.trim()||'logistics@brand.co';
    const cur=D_().autoPO||{on:false};
    D_().autoPO={on:!cur.on,email};
    save();render();toast(D_().autoPO.on?`자동 발주 ON — 매일 09:00 ${email} 발송`:'자동 발주 OFF');
  },
  regongu(cid){
    const old=camp(cid);
    const id='c'+(D_().seq++);
    D_().campaigns.push({id,sellerId:old.sellerId,productId:old.productId,status:'TESTING',testDue:ymd(addD(today(),14)),createdAt:ymd(today())});
    pushSys(id,`🔁 <b>재공구</b> — 지난 공구(${cid.toUpperCase()}) 성과 기반. 샘플 단계 생략, 일정 제안부터 시작합니다`);
    save();S.view.cid=id;render();toast('재공구 캠페인 생성 — 일정 제안부터 시작');
  },
  settleCSV(){
    let cs;
    if(S.view.role==='seller') cs=D_().campaigns.filter(c=>c.sellerId===S.actingSeller&&['LIVE','CLEARING','SETTLED'].includes(c.status));
    else {const myP=D_().products.filter(p=>p.brandId===S.actingBrand).map(p=>p.id);cs=D_().campaigns.filter(c=>myP.includes(c.productId)&&['LIVE','CLEARING','SETTLED'].includes(c.status));}
    const rows=[['캠페인','상품','셀러','시작','종료','확정매출','PG수수료','셀러수수료','플랫폼수수료','브랜드정산액','상태']];
    cs.forEach(c=>{const k=calc(c),p=prod(c.productId);
      rows.push([c.id.toUpperCase(),p.name,seller(c.sellerId).handle,c.start||'',c.end||'',k.net,Math.round(k.pg),Math.round(k.sf),Math.round(k.pf),Math.round(k.brandPay),ST[c.status].l]);});
    dlCSV(`정산명세_${ymd(today())}.csv`,rows);
    toast('정산 명세 CSV 다운로드');
  },
  approveSample(cid){transition(cid,'SAMPLE_APPROVED','브랜드가 샘플 요청을 <b>승인</b>했습니다 · 배송지 전달됨');toast('샘플 승인');},
  rejectSample(cid){transition(cid,'REJECTED','브랜드가 샘플 요청을 거절했습니다');toast('거절 처리');},
  shipSample(cid){
    const t=($('#trackIn')&&$('#trackIn').value.trim())||'6890-'+Math.floor(1000+Math.random()*9000)+'-'+Math.floor(1000+Math.random()*9000);
    const c=camp(cid);c.tracking=t;
    transition(cid,'SAMPLE_SHIPPED',`샘플 발송 · 운송장 <b>${t}</b>`);toast('발송 처리 완료');
  },
  receiveSample(cid){
    const c=camp(cid);c.testDue=ymd(addD(today(),14));
    transition(cid,'TESTING',`셀러가 샘플을 수령했습니다 · 테스트 기한 <b>${md(P(c.testDue))}</b>`);toast('수령 확인 — 테스트 시작');
  },
  passCamp(cid){transition(cid,'PASSED','셀러가 테스트 후 <b>패스</b>를 선택했습니다');toast('패스 처리');},
  openSchedule(cid){scheduleModal(cid);},
  proposeSchedule(cid){
    const st=$('#schStart').value,len=+$('#schLen').value,qty=+$('#schQty').value;
    if(!st){toast('시작일을 선택하세요');return;}
    const en=ymd(addD(P(st),len-1));
    const c=camp(cid);
    if(overlaps(c.productId,st,en,cid)){toast('⚠ 이미 확정된 기간과 겹칩니다 — 다른 날짜를 선택하세요');return;}
    c.propStart=st;c.propEnd=en;c.propQty=qty;
    closeModal();
    transition(cid,'SCHEDULE_PROPOSED',`셀러가 공구 일정을 제안했습니다 · <b>${md(P(st))} – ${md(P(en))}</b> · 재고 ${fmt(qty)}`);
    toast('일정 제안 완료 — 브랜드 승인 대기');
  },
  confirmSchedule(cid){
    const c=camp(cid);c.start=c.propStart;c.end=c.propEnd;c.qty=c.propQty;
    transition(cid,'SCHEDULE_CONFIRMED',`브랜드가 일정을 <b>승인</b>했습니다 · ${md(P(c.start))} – ${md(P(c.end))} 기간 독점 확정`);
    toast('일정 확정 — 캘린더 잠금');
  },
  rejectSchedule(cid){transition(cid,'TESTING','브랜드가 일정을 반려했습니다 · 다른 기간으로 재제안해주세요');toast('반려 — 셀러 재제안 대기');},
  goLive(cid){
    const c=camp(cid);
    if(P(c.start)>today()){c.start=ymd(today());if(P(c.end)<P(c.start))c.end=ymd(addD(today(),4));}
    transition(cid,'LIVE','공구 링크 활성화 — <b>판매 시작</b>');toast('공구 LIVE! 링크가 활성화되었습니다');
  },
  simOrders(cid){simSell(cid,5);},
  simOrders20(cid){simSell(cid,20);},
  simBuy(cid){simSell(cid,1);closeModal();},
  endCamp(cid){
    const c=camp(cid);c.end=ymd(today());
    transition(cid,'CLEARING',`공구 종료 · 교환/환불 기간 시작 (정산 예정 <b>${md(settleDue(c))}</b>)`);
    const po=D_().autoPO;
    if(po&&po.on){pushSys(cid,`📦 최종 발주서 자동 발송 완료 — ${esc(po.email)} (자동 발주)`);save();render();}
    toast('공구 종료 — D+21 클리어링 시작'+(po&&po.on?' · 최종 발주서 자동 발송됨':''));
  },
  ffwd(cid){
    const c=camp(cid);c.end=ymd(addD(today(),-CLEAR_DAYS));
    pushSys(cid,'⏩ (시뮬레이션) 3주 경과 — 정산 기준일 도래');
    save();render();toast('3주 경과 처리 — 관리자 탭에서 정산 실행 가능');
  },
  refund(oid){
    const o=D_().orders.find(x=>x.id===oid);o.status='REFUNDED';
    pushSys(o.campaignId,`환불 처리 · ${o.buyer} · ₩${fmt(o.unit*o.qty)} (정산액 차감)`);
    save();render();toast('환불 처리 — 정산 기준액에서 차감됨');
  },
  runSettle(cid){
    const c=camp(cid),k=calc(c),p=prod(c.productId);
    c.status='SETTLED';c.settledAt=ymd(today());
    D_().settlements.push({at:ymd(today()),title:`${p.name} · ${seller(c.sellerId).handle}`,net:k.net,brandPay:k.brandPay,sellerPay:k.sf*(1-WHT),platFee:k.pf});
    pushSys(cid,`<b>정산 완료</b> · 브랜드 ₩${fmt(k.brandPay)} · 셀러 ₩${fmt(k.sf*(1-WHT))} (원천징수 3.3% 공제) · 명세 발행`);
    save();render();toast('정산 실행 완료 — 양측 지급 및 명세 발행');
  },
  approveProduct(pid){const p=prod(pid);p.status='listed';p.stock=p.stock||500;save();render();toast(`${p.name} 노출 승인`);},
  rejectProduct(pid){const p=prod(pid);D_().products=D_().products.filter(x=>x.id!==pid);save();render();toast('반려 처리');},
  newProduct(){productModal();},
  createProduct(){
    const nm=$('#npName').value.trim();if(!nm){toast('상품명을 입력하세요');return;}
    D_().products.push({id:'p'+(D_().seq++),brandId:S.actingBrand,name:nm,desc:$('#npDesc').value.trim()||'—',em:'📦',cat:$('#npCat').value||'건기식',
      cp:+$('#npCp').value||0,gp:+$('#npGp').value||0,rate:(+$('#npRate').value||20)/100,sample:$('#npSample').value||'무상 1개',stock:+$('#npStock').value||0,status:'pending'});
    closeModal();save();render();toast('검수 요청 완료 — 관리자 승인 후 노출');
  },
  preview(cid){previewModal(cid);},
  copyLink(url){
    try{navigator.clipboard.writeText('https://'+url);toast('링크 복사됨');}catch(e){toast('복사 실패 — 수동으로 복사해주세요');}
  },
  sendChat(cid){
    const inp=$('#chatIn');const t=inp.value.trim();if(!t)return;
    pushChat(cid,S.view.role==='brand'?'brand':'seller',t);
    save();render();
  }
};
function simSell(cid,n){
  const c=camp(cid),p=prod(c.productId);
  const names=['김*은','이*아','박*희','최*진','정*수','한*별','윤*서','장*미'];
  for(let i=0;i<n;i++){
    D_().orders.push({id:'o'+(D_().seq++),campaignId:cid,buyer:names[Math.floor(Math.random()*8)],
      qty:Math.random()<.25?2:1,unit:p.gp,status:'PAID',at:ymd(today())});
  }
  save();render();toast(`주문 ${n}건 발생 (시뮬레이션)`);
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.k,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('select[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.value,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatIn'){const b=document.querySelector('[data-act="sendChat"]');if(b)b.click();}
  if(e.key==='Escape')closeModal();
});
render();
</script>
