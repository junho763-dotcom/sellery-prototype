<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>셀러리 프로토타입</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20stroke%3D%22%23141414%22%20stroke-width%3D%221.5%22%3E%3Ccircle%20cx%3D%226.5%22%20cy%3D%225.5%22%20r%3D%223%22%20fill%3D%22%239cc86a%22%2F%3E%3Ccircle%20cx%3D%2217.5%22%20cy%3D%225.5%22%20r%3D%223%22%20fill%3D%22%239cc86a%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%224.4%22%20r%3D%223.4%22%20fill%3D%22%236da33a%22%2F%3E%3Crect%20x%3D%224.6%22%20y%3D%228.2%22%20width%3D%224.2%22%20height%3D%2212.8%22%20rx%3D%222.1%22%20fill%3D%22%23cfe3a4%22%2F%3E%3Crect%20x%3D%2215.2%22%20y%3D%228.2%22%20width%3D%224.2%22%20height%3D%2212.8%22%20rx%3D%222.1%22%20fill%3D%22%23cfe3a4%22%2F%3E%3Crect%20x%3D%229.9%22%20y%3D%227.4%22%20width%3D%224.2%22%20height%3D%2213.6%22%20rx%3D%222.1%22%20fill%3D%22%23aed378%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@500;600;700;800;900&display=swap">
<style>
/* SELLERY — neo-brutalist editorial skin (single committed theme) */
:root{
  --bg:#efede2;
  --surface:#fdfcf6;
  --surface-2:#e6e3d4;
  --ink:#141414;
  --mute:#6d6a5c;
  --line:#141414;
  --soft-line:#d6d3c2;
  --red:#457c28; /* brand accent — warm celery-leaf green, tuned to the cream ground */
  --red-soft:#e8efda;
  --yellow:#f7df3e;
  --yellow-soft:#faf3c4;
  --money:#8f6400;
  --money-soft:#f5ecc9;
  --danger:#e03131;
  --danger-soft:#fbe3e0;
  --info:#2757a8;
  --info-soft:#e2ebf9;
  --brand-c:#2757a8; --brand-bg:#e2ebf9;
  --seller-c:#c02467; --seller-bg:#fbe0ec;
  --plat-c:#2f7d32; --plat-bg:#e2f0dd;
  --hs:4px 4px 0 var(--ink);
  --hs-sm:3px 3px 0 var(--ink);
  --hs-red:4px 4px 0 var(--red);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;cursor:pointer;
  border:2px solid var(--ink);border-radius:4px;padding:9px 16px;
  background:var(--surface);color:var(--ink);font-weight:700;letter-spacing:.02em;
  box-shadow:var(--hs-sm);transition:transform .12s ease,box-shadow .12s ease}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--ink);color:var(--surface);box-shadow:var(--hs-red)}
button.pri:hover{box-shadow:5px 5px 0 var(--red)}
button.pri:active{box-shadow:1px 1px 0 var(--red)}
button.ghost{background:transparent}
button.danger{background:var(--red);color:#fff;box-shadow:var(--hs-sm)}
button.sm{padding:6px 12px;font-size:11.5px}
button[disabled]{cursor:not-allowed;opacity:.45;transform:none!important;box-shadow:var(--hs-sm)!important}
input,select,textarea{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:13px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:9px 12px;width:100%}
textarea{resize:vertical;font-family:'IBM Plex Sans KR',sans-serif}
:focus{outline:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== app bar ===== */
.appbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:22px;padding:12px 24px;flex-wrap:wrap}
.wordmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;white-space:nowrap;
  background:var(--surface);border:2px solid var(--ink);box-shadow:var(--hs-red);padding:5px 16px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px}
.wordmark svg{flex-shrink:0;transform:rotate(-4deg)}
.wordmark .dot{color:var(--red);font-style:normal}
.roletabs{display:flex;gap:8px}
.roletabs button{background:transparent;border:2px solid transparent;box-shadow:none;color:var(--mute);
  padding:6px 12px;font-size:12px;letter-spacing:.08em;position:relative;text-transform:uppercase}
.roletabs button:hover{color:var(--ink);transform:none;box-shadow:none}
.roletabs button.on{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:var(--hs-sm)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  border:1.5px solid var(--ink);border-radius:999px;min-width:17px;height:17px;line-height:14px;padding:0 4px;text-align:center}
.master{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:999px;background:var(--surface);color:var(--ink)}
.iconbtn:hover{background:var(--yellow)}

/* ===== ticker ===== */
.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--ink)}
.ticker .tk{display:inline-block;padding:7px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;animation:tick 28s linear infinite}
.ticker em{font-style:italic;color:var(--yellow);letter-spacing:.05em}
.ticker .sp{color:var(--red);margin:0 18px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker .tk{animation:none}}

/* ===== sub nav ===== */
.subnav{display:flex;gap:8px;padding:16px 24px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap;align-items:center}
.subnav button{background:transparent;border:2px solid var(--ink);box-shadow:none;padding:6px 14px;font-size:12px;color:var(--ink)}
.subnav button:hover{box-shadow:var(--hs-sm)}
.subnav button.on{background:var(--ink);color:var(--bg);box-shadow:var(--hs-red)}
.persona{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.persona select{width:auto;padding:5px 8px;font-size:12px}
@media(max-width:640px){
  .subnav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{white-space:nowrap;flex-shrink:0}
  .persona{margin-left:0;flex-shrink:0}
  .cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .cats::-webkit-scrollbar{display:none}
  .catchip{white-space:nowrap;flex-shrink:0}
}

main{max-width:1200px;margin:0 auto;padding:26px 24px 90px}
h2.pg{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:30px;font-weight:800;margin:8px 0 22px;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h2.pg small{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px;color:var(--mute);font-weight:400;margin-left:12px;letter-spacing:0;text-transform:none}

/* ===== hero band ===== */
.hero-band{position:relative;background:var(--bg);padding:34px 4px 58px;margin-bottom:-30px}
.hero-band .ey{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--red);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.hero-band .ey::before{content:'→ ';font-weight:400}
.hero-band h1{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:clamp(26px,4.4vw,44px);font-weight:800;margin:0;line-height:1.32;letter-spacing:-.015em;text-wrap:balance}
.hero-band h1 em{font-style:normal;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:0 8px;display:inline-block;transform:rotate(-.6deg)}
.hero-band .sub{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;color:var(--mute);margin-top:12px}
.hero-band .sub b{color:var(--ink)}
.overlap{position:relative;z-index:2}
main > *{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
main > *:nth-child(2){animation-delay:.04s}
main > *:nth-child(3){animation-delay:.08s}
main > *:nth-child(4){animation-delay:.12s}
main > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== category chips ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.catchip{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:6px 14px;font-size:12px;color:var(--ink);font-weight:700;box-shadow:none;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.catchip:hover{box-shadow:var(--hs-sm)}
.catchip.on{background:var(--yellow);box-shadow:var(--hs-sm)}

/* ===== cards & grids ===== */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:var(--hs)}
.kpi .lbl{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.kpi .val{font-family:'Archivo',sans-serif;font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--mute);margin-top:3px}
.sec{margin:36px 0 14px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.sec::before{content:'';width:10px;height:10px;background:var(--red)}
.sec::after{content:'';flex:1;height:2px;background:var(--ink)}
.lbl-sm{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:700}

/* ===== chips ===== */
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;vertical-align:middle;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.chip.brand{color:var(--brand-c);background:var(--brand-bg)}
.chip.seller{color:var(--seller-c);background:var(--seller-bg)}
.chip.plat{color:var(--plat-c);background:var(--plat-bg)}
.chip.auto{color:var(--mute);background:var(--surface-2)}
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.st.gray{background:var(--surface-2);color:var(--mute)}
.st.blue{background:var(--info-soft);color:var(--info)}
.st.green{background:var(--plat-bg);color:var(--plat-c)}
.st.amber{background:var(--yellow-soft);color:var(--money)}
.st.red{background:var(--danger-soft);color:var(--danger)}
.st.live{background:var(--red);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
.gradebox{display:inline-block;font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 10px;background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);white-space:nowrap;flex-shrink:0}
.gradebox.sm{font-size:9.5px;padding:2px 7px;box-shadow:1.5px 1.5px 0 var(--ink)}
.meter{height:14px;border:2px solid var(--ink);background:var(--surface);position:relative}
.meter span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--yellow),var(--yellow) 8px,var(--ink) 8px,var(--ink) 10px)}

/* ===== tables ===== */
.tblw{overflow-x:auto;background:var(--surface);border:2px solid var(--ink);border-radius:6px;box-shadow:var(--hs)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--ink);font-weight:700;background:var(--yellow-soft);padding:10px 16px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--soft-line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--yellow-soft)}
tr.merow td{background:var(--yellow-soft);font-weight:700}

/* ===== product cards ===== */
.prod{display:flex;flex-direction:column;gap:9px;transition:transform .14s ease,box-shadow .14s ease}
.prod:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.prod .ph{height:128px;border:2px solid var(--ink);background:var(--surface-2);
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 14px,rgba(20,20,20,.045) 14px,rgba(20,20,20,.045) 28px);
  display:flex;align-items:center;justify-content:center;font-size:44px;transform:rotate(-1.2deg);box-shadow:var(--hs-sm)}
.grid > .prod:nth-child(even) .ph{transform:rotate(1deg)}
.prod .nm{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase}
.prod .meta{font-size:12px;color:var(--mute)}
.prod .prices{display:flex;align-items:baseline;gap:8px}
.prod .gp{font-family:'Archivo',sans-serif;font-size:19px;font-weight:800}
.prod .cp{font-size:12px;color:var(--mute);text-decoration:line-through}
.prod .rate{font-size:10.5px;font-weight:800;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px;font-family:'IBM Plex Mono',monospace}

/* ===== campaign detail ===== */
.det-head{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;box-shadow:var(--hs)}
.det-head .t{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:19px;font-weight:800;text-transform:uppercase}
.det-body{display:grid;grid-template-columns:1fr 350px;gap:18px;margin-top:18px;align-items:start}
@media(max-width:900px){.det-body{grid-template-columns:1fr}}

/* ===== thread ===== */
.thread{background:var(--surface);border:2px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;min-height:440px;box-shadow:var(--hs)}
.thread .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:540px}
.msg{max-width:78%;padding:9px 13px;border:1.5px solid var(--ink);border-radius:4px;font-size:13.5px;background:var(--surface-2);box-shadow:2px 2px 0 var(--ink)}
.msg .who{font-size:10.5px;font-weight:800;margin-bottom:2px;letter-spacing:.04em;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.msg.seller{align-self:flex-start;background:var(--seller-bg)}
.msg.brand{align-self:flex-end;background:var(--brand-bg)}
.msg .tm{font-size:10.5px;color:var(--mute);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.sysline{align-self:center;font-size:11.5px;color:var(--mute);background:var(--bg);border:1.5px dashed var(--mute);border-radius:3px;padding:4px 14px;text-align:center}
.sysline b{color:var(--ink)}
.warnline{align-self:center;font-size:11.5px;color:#fff;background:var(--danger);border:1.5px solid var(--ink);border-radius:3px;padding:6px 13px;text-align:center;max-width:90%;box-shadow:2px 2px 0 var(--ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:2px solid var(--ink)}
.composer .as{font-size:10.5px;color:var(--mute);white-space:nowrap;align-self:center;font-weight:700;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.composer button{white-space:nowrap}

/* ===== action panel ===== */
.actions .card{margin-bottom:16px}
.actions h4{margin:0 0 8px;font-size:13.5px;font-weight:800}
.actions .hint{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.sim{border:2px dashed var(--ink);background:var(--yellow-soft);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.sim h4{margin:0 0 4px;font-size:10.5px;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.sim p{font-size:11.5px;color:var(--mute);margin:0 0 10px}

/* ===== stepper ===== */
.stepper{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
.stp{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;padding:3px 8px;border:1.5px solid var(--soft-line);background:var(--surface);color:var(--mute);white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stp.done{background:var(--yellow-soft);border-color:var(--ink);color:var(--ink)}
.stp.now{background:var(--ink);border-color:var(--ink);color:var(--yellow)}

/* ===== calendar slots ===== */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;background:var(--surface-2);border:1.5px solid var(--ink);border-radius:3px;padding:8px 13px}
.slot .rng{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700}

/* ===== list rows ===== */
.rowitem{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--soft-line);cursor:pointer;flex-wrap:wrap;transition:background .1s}
.rowitem:last-child{border-bottom:none}
.rowitem:hover{background:var(--yellow-soft)}
.rowitem .grow{flex:1;min-width:180px}
.rowitem .nm{font-weight:800;font-size:14px}
.rowitem .sub{font-size:12px;color:var(--mute)}
.listcard{background:var(--surface);border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.empty{padding:32px;text-align:center;color:var(--mute);font-size:13px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}

/* ===== modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:6px;max-width:530px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:8px 8px 0 var(--ink);animation:min .16s ease}
@keyframes min{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px;font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);margin-bottom:5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ===== buyer landing ===== */
.landing{border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.landing .hero{background:var(--yellow);padding:34px 22px 26px;text-align:center;position:relative;border-bottom:2px solid var(--ink)}
.landing .hero::after{content:'LIMITED RUN';position:absolute;top:12px;left:50%;transform:translateX(-50%) rotate(-2deg);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.3em;color:#fff;background:var(--red);border:1.5px solid var(--ink);padding:2px 10px;font-weight:700}
.landing .hero .em{font-size:52px;display:block;margin-top:14px}
.landing .hero h3{font-family:'Archivo','IBM Plex Sans KR',sans-serif;margin:10px 0 3px;font-size:22px;font-weight:800;text-transform:uppercase}
.landing .hero .by{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;color:var(--ink)}
.landing .body{padding:20px 22px;background:var(--surface)}
.landing .pr{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-bottom:6px}
.landing .pr .g{font-family:'Archivo',sans-serif;font-size:31px;font-weight:800}
.landing .pr .c{color:var(--mute);text-decoration:line-through;font-size:13px}
.landing .timer{text-align:center;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px;color:var(--danger);font-weight:700;margin-bottom:14px;letter-spacing:.04em}
.landing .buy{width:100%;padding:14px;font-size:14px}

/* ===== toast ===== */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;font-weight:700;padding:11px 20px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--red);animation:tin .2s ease;max-width:88vw}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== settlement ===== */
.stmt td:first-child{color:var(--mute)}
.stmt .tot td{font-weight:800;background:var(--yellow-soft);border-top:2px solid var(--ink)}
.notice{background:var(--info-soft);border:1.5px solid var(--info);border-radius:4px;padding:11px 15px;font-size:12.5px;color:var(--info);margin-bottom:16px}
code{font-family:'IBM Plex Mono',monospace;font-size:.9em;background:var(--yellow-soft);border:1px solid var(--soft-line);padding:1px 6px;border-radius:3px}

/* ===== live sales ===== */
.feed{max-height:300px;overflow-y:auto}
.feed .rowitem{cursor:default;padding:10px 16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars .b{flex:1;background:var(--ink);border:1.5px solid var(--ink);min-height:3px;position:relative}
.bars .b:last-child{background:var(--red)}
.bars .b .bl{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mute)}
.bars .b .bd{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mute)}
.barwrap{padding:4px 6px 24px}
.livegrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.livegrid{grid-template-columns:1fr}}
.autopo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ===== trend / exclusive ===== */
.trendbadge{position:absolute;top:8px;left:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:800;color:#fff;background:var(--danger);border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.04em}
.exclbadge{position:absolute;bottom:8px;right:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:800;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.06em;transform:rotate(1.2deg)}
.exclbox{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:4px;padding:12px 14px;box-shadow:var(--hs-sm)}

/* ===== grade pyramid & home news ===== */
.pyr{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:12px}
.pyr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--soft-line);padding:3px 10px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;font-weight:700;max-width:100%;letter-spacing:.02em;white-space:nowrap}
.pyr-row span{white-space:nowrap}
.pyr-row .pct{color:var(--mute);font-weight:500}
.pyr-row.me{background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:11.5px;padding:5px 13px;position:relative;z-index:1}
.pyr-row.me .pct{color:var(--ink);font-weight:700}
.news{display:flex;flex-direction:column}
.news-item{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-top:1px solid var(--soft-line);cursor:pointer;font-size:13px;line-height:1.55}
.news-item:hover{background:var(--yellow-soft)}
.nb{flex-shrink:0;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;font-weight:800;border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.06em;margin-top:2px;white-space:nowrap}
.nb.hot{background:var(--danger);color:#fff}
.nb.new{background:var(--red);color:#fff}
.nb.excl{background:var(--yellow);color:var(--ink)}

/* ===== avatars & platform icons ===== */
.plic{vertical-align:-2px;margin-right:1px}
.gi{vertical-align:-1.5px;margin-right:2px}
.mebadge{display:inline-block;font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:800;background:var(--ink);color:var(--yellow);padding:1px 6px;letter-spacing:.14em;vertical-align:1.5px;line-height:1.6}

/* ===== peer bestseller bars ===== */
.hb-row{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.hb-row:hover .hb-nm{text-decoration:underline}
.hb-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{background:var(--surface-2);border:1.5px solid var(--ink);height:16px}
.hb-bar{height:100%;background:repeating-linear-gradient(-45deg,var(--ink),var(--ink) 7px,#3a3830 7px,#3a3830 9px)}
.hb-bar.top{background:repeating-linear-gradient(-45deg,var(--yellow),var(--yellow) 8px,var(--ink) 8px,var(--ink) 10px)}
.hb-val{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:640px){.hb-row{grid-template-columns:110px 1fr 78px}.hb-nm{font-size:11px}.hb-val{font-size:10px}}

/* ===== seller cards (gallery) ===== */
.scard{display:flex;flex-direction:column}
.rec-tag{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--yellow);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 10px;margin:-6px 0 12px;align-self:flex-start;transform:rotate(-.8deg)}
.sc-av{width:58px;height:58px;flex-shrink:0;border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 var(--ink);background-size:cover;background-position:center;background-color:var(--surface-2)}
.sc-av.em{display:flex;align-items:center;justify-content:center;font-size:26px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 12px}
.mini-stats>div{background:var(--surface-2);border:1.5px solid var(--soft-line);padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.ms-l{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:8.5px;color:var(--mute);letter-spacing:.05em;white-space:nowrap}
.ms-v{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;flex:1}
@media(max-width:640px){.mini-stats{grid-template-columns:repeat(2,1fr)}.sc-cols{grid-template-columns:1fr}}
.sc-hist{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:11.5px;border:1.5px solid var(--soft-line);background:var(--surface-2);padding:5px 9px;margin-bottom:5px;cursor:pointer}
.sc-hist:hover{border-color:var(--ink)}
.sc-hist .st{font-size:9px;padding:1px 6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;border-bottom:1.5px solid var(--ink);padding:0 2px}
.spark span{flex:1;background:var(--red);border:1px solid var(--ink);border-bottom:none;min-height:4px}

/* ===== gongu calendar ===== */
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.cal-legend{margin-left:auto;font-size:10.5px;color:var(--mute);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cal-legend span{white-space:nowrap}
.lg{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px}
.lg.plan{background:var(--yellow)}.lg.live{background:var(--red)}.lg.done{background:var(--surface-2)}.lg.pay{background:var(--money-soft)}.lg.due{background:var(--danger)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--soft-line);text-align:center;padding:7px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:68px;border-top:1px solid var(--soft-line);border-left:1px solid var(--soft-line);padding:4px 4px 6px;overflow:hidden}
.cal-cell:nth-child(7n+1){border-left:none}
.cal-cell.off{background:repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(20,20,20,.03) 6px,rgba(20,20,20,.03) 12px)}
.cal-cell .dn{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute)}
.cal-cell.today{background:var(--yellow-soft)}
.cal-cell.today .dn{font-weight:800;color:var(--ink);background:var(--yellow);border:1px solid var(--ink);padding:0 4px}
.cal-ev{font-size:9px;font-weight:700;border:1px solid var(--ink);padding:0 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.8;border-radius:2px}
.cal-ev.plan{background:var(--yellow)}
.cal-ev.live{background:var(--red);color:#fff}
.cal-ev.done{background:var(--surface-2);color:var(--mute)}
.cal-ev.pay{background:var(--money-soft);color:var(--money)}
.cal-ev.due{background:var(--danger);color:#fff}
@media(max-width:640px){.cal-cell{min-height:54px;padding:3px}.cal-ev{font-size:7.5px;padding:0 2px}.cal-legend{margin-left:0}}
.hero-av{position:absolute;top:30px;right:6px;width:88px;height:88px;object-fit:cover;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:rotate(2deg);background:var(--surface)}
@media(max-width:640px){.hero-av{position:static;display:block;width:64px;height:64px;margin:0 0 12px;transform:rotate(-2deg)}}
.ph.av{background-size:cover;background-position:center;transform:none!important}

</style>

const D_ = () => S.data;
const prod = id => D_().products.find(p=>p.id===id);
const brand = id => D_().brands.find(b=>b.id===id);
const seller = id => D_().sellers.find(s=>s.id===id);
const camp = id => D_().campaigns.find(c=>c.id===id);
const campOrders = cid => D_().orders.filter(o=>o.campaignId===cid);
function isRefBoost(c){
  const s=seller(c.sellerId);
  if(!s||!s.referredBy)return false;
  const list=D_().campaigns.filter(x=>x.sellerId===c.sellerId&&['LIVE','CLEARING','SETTLED'].includes(x.status))
    .sort((a,b)=>a.createdAt<b.createdAt?-1:1);
  const idx=list.findIndex(x=>x.id===c.id);
  return idx>-1&&idx<REF_TIMES;
}
function calc(c){
  const os=campOrders(c.id);
  const gross=os.filter(o=>o.status!=='CANCELED').reduce((a,o)=>a+o.unit*o.qty,0);
  const refund=os.filter(o=>o.status==='REFUNDED').reduce((a,o)=>a+o.unit*o.qty,0);
  const net=gross-refund;
  const p=prod(c.productId);
  const rb=isRefBoost(c);
  const pg=net*PG_RATE, sf=net*p.rate;
  const boost=rb?net*REF_BOOST:0, refReward=rb?net*REF_RATE:0;
  const pf=net*PLAT_RATE-boost-refReward;
  return {gross,refund,net,pg,sf,sfTotal:sf+boost,boost,refReward,rb,pf,
    brandPay:net-pg-sf-net*PLAT_RATE,
    paidCnt:os.filter(o=>o.status==='PAID').length,refCnt:os.filter(o=>o.status==='REFUNDED').length};
}

  }
}

/* ---- my gongu calendar ---- */
function calHtml(){
  const off=S.calOff||0;
  const base=new Date(today().getFullYear(),today().getMonth()+off,1);
  const y=base.getFullYear(),m=base.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const mine=D_().campaigns.filter(c=>c.sellerId===S.actingSeller);
  const evFor=date=>{
    const t=date.getTime(),ds=ymd(date);
    const out=[];
    mine.forEach(c=>{
      if(c.start&&['SCHEDULE_CONFIRMED','LIVE','CLEARING','SETTLED'].includes(c.status)){
        const s=P(c.start).getTime(),e=P(c.end).getTime();
        if(t>=s&&t<=e)out.push({type:c.status==='LIVE'?'live':c.status==='SCHEDULE_CONFIRMED'?'plan':'done',name:prod(c.productId).name,first:t===s,cid:c.id});
        if(c.status==='CLEARING'&&ymd(settleDue(c))===ds)out.push({type:'pay',name:'₩ 정산 예정',first:true,cid:c.id});
      }
      if(c.status==='TESTING'&&c.testDue===ds)out.push({type:'due',name:'테스트 마감',first:true,cid:c.id});
    });
    return out;
  };
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell off"></div>';
  for(let d=1;d<=dim;d++){
    const date=new Date(y,m,d);
    const evs=evFor(date);
    cells+=`<div class="cal-cell ${ymd(date)===ymd(today())?'today':''}"><span class="dn">${d}</span>
      ${evs.map(ev=>`<div class="cal-ev ${ev.type}" data-act="open" data-k="${ev.cid}" title="${esc(ev.name)}">${ev.first?esc(ev.name):'&nbsp;'}</div>`).join('')}</div>`;
  }
  return `<div class="sec">판매 캘린더 — 내 스케줄 한눈에</div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="cal-head">
      <button class="sm ghost" data-act="calNav" data-k="-1">‹</button>
      <b style="font-family:'Archivo',sans-serif;font-size:16px;letter-spacing:.02em">${y}.${String(m+1).padStart(2,'0')}</b>
      <button class="sm ghost" data-act="calNav" data-k="1">›</button>
      ${off!==0?`<button class="sm ghost" data-act="calNav" data-k="0">오늘</button>`:''}
      <span class="cal-legend"><span><i class="lg plan"></i>확정</span><span><i class="lg live"></i>LIVE</span><span><i class="lg done"></i>종료·정산중</span><span><i class="lg pay"></i>정산일</span><span><i class="lg due"></i>테스트 마감</span></span>
    </div>
    <div class="cal-dow">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

       :isSeller?(already?`<button class="sm" disabled style="opacity:.6">신청 완료 — 브랜드 승인 대기</button>`
         :q?`<button class="pri sm" data-act="reqExclusive" data-k="${pid}">독점권 신청 — 내 등급 ${gfull(gname(me))} 충족 ✓</button>`

function vSales(){
  let cs;
  if(S.view.role==='seller') cs=D_().campaigns.filter(c=>c.sellerId===S.actingSeller&&c.status==='LIVE');
  else {const myP=D_().products.filter(p=>p.brandId===S.actingBrand).map(p=>p.id);cs=D_().campaigns.filter(c=>myP.includes(c.productId)&&c.status==='LIVE');}
  const t=ymd(today());
  const head=`<h2 class="pg">실시간 매출 <small>LIVE 판매의 판매 현황 — 주문이 들어오면 즉시 반영</small></h2>
  <div style="margin-bottom:16px"><button class="${liveTimer?'danger':'pri'}" data-act="toggleLive">${liveTimer?'⏸ 실시간 판매 시뮬레이션 중지':'▶ 실시간 판매 시뮬레이션 시작'}</button>
  <span style="font-size:12px;color:var(--mute);margin-left:10px">실서비스에선 결제 웹훅으로 자동 반영됩니다</span></div>`;
  if(!cs.length) return head+`<div class="listcard"><div class="empty">지금 LIVE 상태인 판매가 없습니다 — 캠페인을 시작해보세요</div></div>`;
  return head+cs.map(c=>{
    const p=prod(c.productId),s=seller(c.sellerId),k=calc(c);
    const os=campOrders(c.id);
    const todayOs=os.filter(o=>o.at===t&&o.status==='PAID');
    const todayRev=todayOs.reduce((a,o)=>a+o.unit*o.qty,0);
    const visits=Math.round((k.paidCnt+k.refCnt)*17.3);
    const conv=visits?((k.paidCnt+k.refCnt)/visits*100).toFixed(1):'0.0';
    // last 7 days bars
    const days=[...Array(7)].map((_,i)=>{const d=ymd(addD(today(),i-6));
      const rev=os.filter(o=>o.at===d&&o.status!=='CANCELED').reduce((a,o)=>a+o.unit*o.qty,0);
      return {d,rev};});
    const mx=Math.max(...days.map(x=>x.rev),1);
    const feed=os.slice(-10).reverse();
    return `<div class="sec">${esc(p.name)} · ${s.handle} <span class="st live" style="margin-left:4px"><span class="pulse"></span>LIVE</span></div>
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">오늘 매출</div><div class="val">₩${fmt(todayRev)}</div><div class="sub">주문 ${todayOs.length}건</div></div>
      <div class="card kpi"><div class="lbl">누적 확정 매출</div><div class="val">₩${fmt(k.net)}</div><div class="sub">결제 ${k.paidCnt}건 · 환불 ${k.refCnt}건</div></div>
      <div class="card kpi"><div class="lbl">${S.view.role==='seller'?'내 수수료 (실시간)':'브랜드 정산액 (실시간)'}</div><div class="val" style="color:var(--money)">₩${fmt(S.view.role==='seller'?k.sfTotal*(1-WHT):k.brandPay)}</div><div class="sub">${S.view.role==='seller'?'원천징수 후 예상':'수수료 차감 후 예상'}</div></div>
      <div class="card kpi"><div class="lbl">방문 → 구매 전환</div><div class="val">${conv}%</div><div class="sub">방문 ${fmt(visits)}회 (추정)</div></div>
    </div>
    <div class="livegrid" style="margin-top:16px">
      <div class="card"><h4 style="margin:0 0 4px;font-size:13px">최근 7일 매출</h4>
        <div class="barwrap"><div class="bars">${days.map(x=>`<div class="b" style="height:${Math.max(3,x.rev/mx*100)}%"><span class="bl">${x.rev?'₩'+fmt(Math.round(x.rev/1000))+'k':''}</span><span class="bd">${md(P(x.d))}</span></div>`).join('')}</div></div>
      </div>
      <div class="card" style="padding:0"><h4 style="margin:0;padding:14px 16px 8px;font-size:13px">주문 피드</h4>
        <div class="feed">${feed.map(o=>`<div class="rowitem"><div class="grow"><span style="font-weight:600">${o.buyer}</span> <span class="sub">${o.qty}개 · ${md(P(o.at))}</span></div><span class="num" style="font-family:'IBM Plex Mono',monospace">₩${fmt(o.unit*o.qty)}</span>${o.status==='REFUNDED'?'<span class="st red">환불</span>':''}</div>`).join('')||'<div class="empty">아직 주문 없음</div>'}</div>
      </div>
    </div>
    <div style="margin-top:12px"><button class="sm ghost" data-act="open" data-k="${c.id}">캠페인 상세 →</button></div>`;
  }).join('');
}

/* ============ BRAND ============ */
function vBrandHome(){
  const me=S.actingBrand;
  const myP=D_().products.filter(p=>p.brandId===me).map(p=>p.id);
  const cs=D_().campaigns.filter(c=>myP.includes(c.productId));
  const pend=cs.filter(c=>['SAMPLE_REQUESTED','SCHEDULE_PROPOSED','SAMPLE_APPROVED'].includes(c.status));
  const live=cs.filter(c=>c.status==='LIVE');
  const gmv=cs.reduce((a,c)=>a+calc(c).net,0);
  const heroLine = pend.length ? `승인 대기 <em>${pend.length}건</em>부터 확인해볼까요?`
    : live.length ? `지금 판매 <em>${live.length}건</em>이 진행 중이에요.`
    : `새 상품을 올리고 셀러를 만나보세요.`;
  // top influencers by recent sales
  const tops=D_().sellers.slice().sort((a,b)=>b.m3Sales-a.m3Sales).slice(0,5);
  const mxS=tops.length?tops[0].m3Sales:1;
  const topChart=`<div class="card">
    <div class="lbl-sm" style="margin-bottom:4px">지금 잘 파는 인플루언서 TOP5</div>
    <div style="font-size:11px;color:var(--mute);margin-bottom:12px">최근 3개월 확정 매출 기준 · 비공개 셀러는 익명</div>
    ${tops.map((x,i)=>`<div class="hb-row" data-act="screen" data-k="gallery">
      <span class="hb-nm">${i+1}. ${platIcon(x)} ${x.hidden?'○○○ 셀러':esc(x.name)+' '+x.handle}</span>
      <div class="hb-track"><div class="hb-bar ${i===0?'top':''}" style="width:${Math.max(6,x.m3Sales/mxS*100)}%"></div></div>
      <span class="hb-val">₩${fmt(x.m3Sales)}</span>
    </div>`).join('')}
  </div>`;
  const scout1=D_().sellers.find(x=>x.hidden);
  const fresh1=D_().sellers.filter(x=>!x.hidden).slice(-1)[0];
  const brandNews=`<div class="card" style="padding:0;overflow:hidden">
    <div class="lbl-sm" style="padding:16px 18px 6px">📢 인플루언서 소식</div>
    <div class="news">
      ${pend.length?`<div class="news-item" data-act="screen" data-k="requests"><span class="nb hot">대기</span><div>승인 대기 요청 <b>${pend.length}건</b> — 응답이 늦으면 셀러가 다른 상품으로 떠나요</div></div>`:''}
      <div class="news-item" data-act="screen" data-k="gallery"><span class="nb hot">급증</span><div><b>${CAT_TRENDS[0].cat}</b> 카테고리 셀러 활동 급증 — ${CAT_TRENDS[0].note}. 제안 경쟁 전에 선점하세요</div></div>
      ${scout1?`<div class="news-item" data-act="screen" data-k="gallery"><span class="nb excl">스카우트</span><div>${gfull(gname(scout1))} <b>○○○ 셀러</b> 프로필 공개 — 3개월 매출 ₩${fmt(scout1.m3Sales)} · ${scout1.cat} 주력</div></div>`:''}
      ${fresh1?`<div class="news-item" data-act="screen" data-k="gallery"><span class="nb new">NEW</span><div><b>${esc(fresh1.name)} ${fresh1.handle}</b> 신규 합류 — ${fresh1.cat} · 팔로워 ${fmt(fresh1.followers)}</div></div>`:''}
    </div>
  </div>`;
  const bsrow=(s,note)=>`<div class="rowitem" style="cursor:default">
    ${s.img?`<div class="sc-av" style="width:44px;height:44px;background-image:url('${s.img}')"></div>`:`<div class="sc-av em" style="width:44px;height:44px;font-size:20px">${SEMOJI[s.id]||'⭐'}</div>`}
    <div class="grow"><div class="nm"><span class="gradebox sm">${gfull(gname(s))}</span> ${esc(s.name)} <span style="color:var(--mute);font-weight:400;font-size:12px">${platIcon(s)} ${s.handle}</span></div>
    <div class="sub">${note}</div></div>
    <button class="pri sm" data-act="invite" data-k="${s.id}">샘플 제안</button></div>`;
  const catMapH={'건강기능식품':['건기식','다이어트','루테인','비타민'],'이너뷰티':['뷰티','이너뷰티','피부','화장품']};
  const relH=catMapH[brand(me).cat]||[];
  const recs3=D_().sellers.filter(s=>!s.hidden).map(s=>({s,fit:relH.includes(s.cat),score:(relH.includes(s.cat)?2:0)+(s.m3Sales/s.followers)/300}))
    .sort((a,b)=>b.score-a.score).slice(0,3);
  const views=(D_().productViews||[]).filter(v=>myP.includes(v.productId));
  return `<div class="hero-band">
    ${brand(me).logo?`<img class="hero-av" src="${brand(me).logo}" alt="브랜드 로고">`:''}
    <div class="ey">Brand Center</div>
    <h1>${brand(me).name} 님, 반가워요.<br>${heroLine}</h1>
    <div class="sub">브랜드 등급 <b>${gfull(bgname(brand(me)))}</b> · 승인 대기 <b>${pend.length}건</b> · 진행 중 판매 <b>${live.length}건</b> · ${new Date().getMonth()+1}월 ${new Date().getDate()}일</div>
  </div>
  <div class="grid g2 overlap">${topChart}${brandNews}</div>
  <div class="sec">내 현황</div>
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">누적 확정 매출 (GMV)</div><div class="val">₩${fmt(gmv)}</div></div>
    <div class="card kpi"><div class="lbl">승인 대기</div><div class="val">${pend.length}건</div><div class="sub">샘플·일정·발송</div></div>
    <div class="card kpi"><div class="lbl">진행 중 판매</div><div class="val">${live.length}건</div></div>
    <div class="card kpi"><div class="lbl">등록 상품</div><div class="val">${myP.length}개</div></div>
  </div>
  ${pend.length?`<div class="sec">승인·처리 대기</div><div class="listcard">${pend.map(c=>campRow(c,{who:'brand'})).join('')}</div>`:''}
  <div class="sec">진행 중 · 확정 판매</div>
  <div class="listcard">${cs.filter(c=>['LIVE','SCHEDULE_CONFIRMED','CLEARING'].includes(c.status)).map(c=>campRow(c,{who:'brand'})).join('')||'<div class="empty">진행 중 판매 없음</div>'}</div>
  <div class="sec">👀 내 상품을 조회한 인플루언서</div>
  <div class="listcard">${views.map(v=>{const s=seller(v.sellerId),p=prod(v.productId);
    return bsrow(s,`${p.em} <b>${esc(p.name)}</b> 조회 · ${v.ago} · 팔로워 ${fmt(s.followers)} · 참여율 ${(s.likesAvg/s.followers*100).toFixed(1)}%`);}).join('')
    ||'<div class="empty">최근 조회 기록이 없습니다</div>'}</div>
  <div class="sec">✦ ${esc(brand(me).name)} 추천 인플루언서</div>
  <div class="listcard">${recs3.map(r=>bsrow(r.s,`${r.fit?'카테고리 적합':'매출 효율 상위'} · ${r.s.cat} · 3개월 ₩${fmt(r.s.m3Sales)} · 매출/팔로워 ₩${fmt(r.s.m3Sales/r.s.followers)}`)).join('')}</div>`;
}

function sellerCard(s,reason){
  const hist=D_().campaigns.filter(c=>c.sellerId===s.id&&['LIVE','CLEARING','SETTLED'].includes(c.status))
    .sort((a,b)=>b.createdAt<a.createdAt?-1:1).slice(0,2);
  const eng=(s.likesAvg/s.followers*100).toFixed(1);
  const rl=s.recentLikes||[];
  const mxL=Math.max(...rl,1);
  const trendUp=rl.length>1&&rl[rl.length-1]>=rl[0];
  return `<div class="card scard">
    ${reason?`<div class="rec-tag">✦ 추천 — ${reason}</div>`:''}
    <div style="display:flex;gap:14px;align-items:center">
      ${s.img?`<div class="sc-av" style="background-image:url('${s.img}')"></div>`:`<div class="sc-av em">${SEMOJI[s.id]||'⭐'}</div>`}
      <div style="flex:1;min-width:0">
        <div><span class="gradebox sm">${gfull(gname(s))}</span> <b style="font-size:15.5px">${esc(s.name)}</b> <span style="color:var(--mute);font-size:12px">${platIcon(s)} ${s.handle}</span></div>
        <div style="font-size:12px;color:var(--mute)">${s.cat} · ${esc(s.intro)}</div>
      </div>
    </div>
    <div class="mini-stats">
      <div><span class="ms-l">3개월 매출</span><span class="ms-v">₩${fmt(s.m3Sales)}</span></div>
      <div><span class="ms-l">팔로워</span><span class="ms-v">${fmt(s.followers)}</span></div>
      <div><span class="ms-l">좋아요 평균</span><span class="ms-v">${fmt(s.likesAvg)}</span></div>
      <div><span class="ms-l">참여율</span><span class="ms-v">${eng}%</span></div>
    </div>
    <div class="sc-cols">
      <div>
        <div class="lbl-sm" style="margin-bottom:6px">최근 진행 이력</div>
        ${hist.length?hist.map(c=>{const p=prod(c.productId),k=calc(c);
          return `<div class="sc-hist" data-act="open" data-k="${c.id}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.em} ${esc(p.name)} <span style="color:var(--mute)">${c.start?md(P(c.start))+'–'+md(P(c.end)):''}</span></span><span style="font-family:'IBM Plex Mono',monospace;white-space:nowrap">₩${fmt(k.net)}</span>${stChip(c.status)}</div>`;}).join('')
        :'<div style="font-size:12px;color:var(--mute)">셀러리 첫 판매 대기 — 지금 제안해 선점하세요</div>'}
      </div>
      <div>
        <div class="lbl-sm" style="margin-bottom:6px">최근 게시물 반응 ${trendUp?'<b style="color:var(--red)">▲ 상승</b>':''}</div>
        <div class="spark">${rl.map(v=>`<span style="height:${Math.max(12,v/mxL*100)}%"></span>`).join('')}</div>
        <div style="font-size:10.5px;color:var(--mute);margin-top:4px">최근 ${rl.length}개 게시물 좋아요</div>
      </div>
    </div>
    <button class="pri" data-act="invite" data-k="${s.id}" style="margin-top:12px;width:100%">판매 직접 제안</button>
  </div>`;
}

    ${un?`<div style="font-size:12.5px;color:var(--mute)">팔로워 ${fmt(s.followers)} · 좋아요 평균 ${fmt(s.likesAvg)} · 참여율 ${(s.likesAvg/s.followers*100).toFixed(1)}% · 매출/팔로워 ₩${fmt(s.m3Sales/s.followers)}</div>

     <div class="btnrow" style="margin-top:12px"><button class="sm" data-act="unlockRef" data-k="${s.id}">🔓 레퍼런스 열람 · ₩29,000 (시뮬)</button></div>`}

  <div class="sec" style="margin-top:0">${esc(b.name)} 맞춤 추천 셀러</div>
  <div class="grid g2">${recs.map(r=>sellerCard(r.s,`${r.catFit?`${esc(b.cat)}와 카테고리 적합`:'매출 효율 상위'} · 매출/팔로워 ₩${fmt(r.s.m3Sales/r.s.followers)}`)).join('')}</div>
  <div class="sec">전체 셀러</div>
  <div class="grid g2">${pub.map(s=>sellerCard(s)).join('')}</div>
  <div class="sec">익명 셀러 스카우트 — 유료 레퍼런스</div>
  <p style="font-size:12.5px;color:var(--mute);margin:-2px 0 14px">프로필 비공개 셀러입니다. 레퍼런스 열람권(건당)을 구매하면 상세 지표를 확인하고 제안을 보낼 수 있습니다. <b>제안이 수락되는 순간 DM이 열리고 신원이 공개됩니다.</b></p>
  <div class="grid g2">${scout}</div>
  <p style="font-size:12px;color:var(--mute);margin-top:12px">※ 프로토타입에서는 제안 시 셀러가 즉시 수락한 것으로 처리되어 '샘플 발송 대기' 상태의 캠페인이 생성됩니다.</p>`;

function detActions(c,k,p,s,linkUrl){
  const A=[];
  const V=S.view.role; // seller | brand | admin — 액션은 해당 역할에게만
  const card=(h,hint,btns)=>`<div class="card"><h4>${h}</h4><p class="hint">${hint}</p><div class="btnrow">${btns}</div></div>`;
  const sim=(h,hint,btns)=>`<div class="sim" style="margin-bottom:12px"><h4>⏱ ${h}</h4><p>${hint}</p><div class="btnrow">${btns}</div></div>`;
  const wait=(t,d)=>card(t+' ⏳',d,'');
  switch(c.status){
    case 'SAMPLE_REQUESTED':
      if(V==='seller') A.push(wait('브랜드 승인 대기 중','샘플 요청이 접수됐어요. 브랜드가 프로필을 검토 중입니다 — 보통 24시간 내 응답해요.'));
      else A.push(card('샘플 요청 검토 <span class="chip brand">브랜드 액션</span>',
        `${platIcon(s)} ${s.name} ${s.handle} · 팔로워 ${fmt(s.followers)} · 등급 ${gname(s)}. 승인 시 배송지가 브랜드에 전달됩니다.`,
        `<button class="pri" data-act="approveSample" data-k="${c.id}">승인</button>
         <button class="danger" data-act="rejectSample" data-k="${c.id}">거절</button>`));
      break;
    case 'SAMPLE_APPROVED':
      if(V==='seller') A.push(wait('샘플 발송 준비 중','브랜드가 요청을 승인했어요. 샘플이 발송되면 운송장이 여기 표시됩니다.'));
      else A.push(card('샘플 발송 <span class="chip brand">브랜드 액션</span>','운송장 번호를 입력하면 배송 추적이 시작됩니다.',
        `<input id="trackIn" placeholder="운송장 번호 (예: 6890-1234-5678)" style="margin-bottom:8px">
         <button class="pri" data-act="shipSample" data-k="${c.id}">발송 처리</button>`));
      break;
    case 'SAMPLE_SHIPPED':
      if(V==='brand') A.push(wait('셀러 수령 대기 중',`운송장 ${c.tracking||'—'} · 셀러가 수령을 확인하면 테스트가 시작됩니다.`));
      else A.push(card('샘플 수령 확인 <span class="chip seller">셀러 액션</span>',`운송장 ${c.tracking||'—'} · 수령 확인 시 테스트 기한 14일이 시작됩니다.`,
        `<button class="pri" data-act="receiveSample" data-k="${c.id}">수령 확인</button>`));
      break;
    case 'TESTING':
      if(V==='brand') A.push(wait('셀러 테스트 중',`셀러가 샘플을 사용해보고 있어요. 기한 ${c.testDue?md(P(c.testDue)):'—'} 까지 진행 여부를 응답합니다.`));
      else A.push(card('테스트 후 진행 결정 <span class="chip seller">셀러 액션</span>',
        `기한 ${c.testDue?md(P(c.testDue)):'—'} 까지. 진행 시 판매 일정을 제안합니다.`,
        `<button class="pri" data-act="openSchedule" data-k="${c.id}">진행할게요 → 일정 제안</button>
         <button data-act="passCamp" data-k="${c.id}">이번엔 패스</button>`));
      break;
    case 'SCHEDULE_PROPOSED':
      if(V==='seller') A.push(wait('브랜드 일정 승인 대기',`제안한 기간 <b>${md(P(c.propStart))} – ${md(P(c.propEnd))}</b> · 재고 ${fmt(c.propQty)}개를 브랜드가 검토 중이에요.`));
      else A.push(card('일정 승인 <span class="chip brand">브랜드 액션</span>',
        `제안 기간: <b>${md(P(c.propStart))} – ${md(P(c.propEnd))}</b> · 배정 재고 ${fmt(c.propQty)}개. 승인 시 이 기간이 캘린더에 잠깁니다(기간 독점).`,
        `<button class="pri" data-act="confirmSchedule" data-k="${c.id}">일정 승인</button>
         <button class="danger" data-act="rejectSchedule" data-k="${c.id}">반려 (재제안 요청)</button>`));
      break;
    case 'SCHEDULE_CONFIRMED':{
      const dday=Math.ceil((P(c.start)-today())/DAY);
      A.push(card('판매 대기 중',`시작 ${md(P(c.start))} (D-${Math.max(dday,0)}) — 시작 시각에 링크가 자동 활성화됩니다.`,''));
      if(V==='admin') A.push(sim('시뮬레이션','실서비스에선 스케줄러가 자동 처리합니다.',
        `<button class="sm" data-act="goLive" data-k="${c.id}">판매 시작 처리</button>`));
      break;}
    case 'LIVE':
      A.push(card('판매 링크 <span class="st live"><span class="pulse"></span>LIVE</span>',
        `<code style="font-size:11.5px">${linkUrl}</code> · 종료 ${md(P(c.end))}`,
        `<button class="pri" data-act="preview" data-k="${c.id}">판매 페이지 미리보기</button>
         <button data-act="copyLink" data-k="${linkUrl}">링크 복사</button>`));
      if(V==='admin') A.push(sim('판매 시뮬레이션','구매자 주문을 흉내내 정산 숫자가 움직이는 걸 확인하세요.',
        `<button class="sm" data-act="simOrders" data-k="${c.id}">주문 +5건</button>
         <button class="sm" data-act="simOrders20" data-k="${c.id}">주문 +20건</button>
         <button class="sm" data-act="endCamp" data-k="${c.id}">판매 종료 처리</button>`));
      break;
    case 'CLEARING':{
      const due=settleDue(c);
      A.push(card('교환·환불 처리 기간',
        `종료 ${md(P(c.end))} → 정산 기준일 <b>${md(due)}</b> (D+${CLEAR_DAYS}). 이 기간의 환불은 정산액에서 차감됩니다.`,''));
      if(V==='admin') A.push(sim('시뮬레이션','',`<button class="sm" data-act="ffwd" data-k="${c.id}">⏩ 3주 경과 처리</button>`));
      break;}
    case 'SETTLED':
      A.push(card('정산 완료 ✓',`셀러 지급 ₩${fmt(k.sfTotal*(1-WHT))} (원천징수 후) · 브랜드 지급 ₩${fmt(k.brandPay)}. 성과가 좋았다면 같은 조합으로 바로 재판매를 열 수 있습니다.`,
        `${V!=='brand'?`<button class="pri" data-act="regongu" data-k="${c.id}">🔁 재판매 제안 (샘플 생략)</button>`:''}
         <button data-act="settleCSV">명세 CSV</button>`));
      break;
    case 'REJECTED': A.push(card('거절된 요청','브랜드가 이번 요청을 승인하지 않았습니다.','')); break;
    case 'PASSED': A.push(card('셀러 패스','셀러가 테스트 후 진행하지 않기로 했습니다.','')); break;
  }
  return A.join('');
}

function fileToDataURL(file,maxW,cb){
  const img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,maxW/img.width);
    const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.8));
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(file);
}

function transition(cid,st,sysTxt){const c=camp(cid);c.status=st;if(sysTxt)pushSys(cid,sysTxt);save();render();}
const ACT={
  role(k){S.view={role:k,screen:'home',cid:null};render();},
  screen(k){S.view.screen=k;S.view.cid=null;render();},
  goHome(){S.view={role:S.view.role,screen:'home',cid:null};render();},
  gotoMy(){
    if(S.view.role==='brand'){S.view={role:'brand',screen:'my',cid:null};render();return;}
    if(S.view.role==='admin'&&S.lockedRole){toast('관리자 설정은 준비 중입니다');return;}
    S.view={role:'seller',screen:'my',cid:null};render();
  },
  saveBrandInfo(){
    const b=brand(S.actingBrand);
    const bank=$('#bmBank').value,account=$('#bmAccount').value.trim(),holder=$('#bmHolder').value.trim(),bizNo=$('#bmBizNo').value.trim();
    b.manager=$('#bmManager').value.trim()||b.manager;
    b.email=$('#bmEmail').value.trim()||b.email;
    if(bank==='선택'||!account||!holder||!bizNo){toast('은행·계좌·예금주·사업자등록번호를 입력해주세요');save();render();return;}
    b.settleInfo={...(b.settleInfo||{}),bank,account,holder,bizNo,mailOrder:$('#bmMailOrder').value.trim()};
    save();render();toast('브랜드 정보 저장 완료');
  },
  brandLogoPick(){
    let inp=document.getElementById('brandLogoFile');
    if(!inp){
      inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.id='brandLogoFile';inp.hidden=true;
      document.body.appendChild(inp);
      inp.addEventListener('change',()=>{
        const f=inp.files[0];if(!f)return;
        const img=new Image();
        img.onload=()=>{
          const sz=192,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
          const x=cv.getContext('2d');
          const m=Math.min(img.width,img.height);
          x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
          brand(S.actingBrand).logo=cv.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.85);
          save();render();toast('브랜드 로고가 등록되었습니다');
          URL.revokeObjectURL(img.src);
        };
        img.src=URL.createObjectURL(f);
        inp.value='';
      });
    }
    inp.click();
  },
  brandDocPick(){
    let inp=document.getElementById('brandDocFile');
    if(!inp){
      inp=document.createElement('input');inp.type='file';inp.accept='image/*,.pdf';inp.id='brandDocFile';inp.hidden=true;
      document.body.appendChild(inp);
      inp.addEventListener('change',()=>{
        const f=inp.files[0];if(!f)return;
        const b=brand(S.actingBrand);
        b.settleInfo={...(b.settleInfo||{}),bizDoc:f.name};
        save();render();toast('사업자등록증 첨부 완료 (프로토타입: 파일명만 저장)');
        inp.value='';
      });
    }
    inp.click();

    let inp=document.getElementById('avFile');
    if(!inp){

          const x=cv.getContext('2d');
          const m=Math.min(img.width,img.height);
          x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
          seller(S.actingSeller).img=cv.toDataURL('image/jpeg',.82);
          save();render();toast('프로필 사진이 등록되었습니다');

      });
    }

  trackCSVPick(){
    let inp=document.getElementById('trackCSVFile');
    if(!inp){
      inp=document.createElement('input');inp.type='file';inp.accept='.csv,.txt';inp.id='trackCSVFile';inp.hidden=true;
      document.body.appendChild(inp);
      inp.addEventListener('change',()=>{
        const f=inp.files[0];if(!f)return;
        const rd=new FileReader();
        rd.onload=()=>{
          const lines=String(rd.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
          let n=0;
          lines.forEach(ln=>{
            const cells=ln.split(/[,\t]/).map(x=>x.replace(/^"|"$/g,'').trim());
            if(cells.length<2||!cells[1]||/주문번호/.test(cells[0]))return;
            const o=D_().orders.find(x=>x.id.toUpperCase()===cells[0].toUpperCase());
            if(o&&o.status==='PAID'){o.tracking=cells[1];n++;}
          });
          save();render();
          toast(n?`✓ 송장 ${n}건 적용 완료 — 배송중 처리`:'매칭된 주문이 없습니다 — 주문번호 열을 확인하세요');
        };
        rd.readAsText(f);
        inp.value='';
      });
    }
    inp.click();
  },

  ffwd(cid){
    const c=camp(cid);c.end=ymd(addD(today(),-CLEAR_DAYS));
    pushSys(cid,'⏩ (시뮬레이션) 3주 경과 — 정산 기준일 도래');
    save();render();toast('3주 경과 처리 — 관리자 탭에서 정산 실행 가능');
  },
  refund(oid){
    const o=D_().orders.find(x=>x.id===oid);o.status='REFUNDED';
    pushSys(o.campaignId,`환불 처리 · ${o.buyer} · ₩${fmt(o.unit*o.qty)} (정산액 차감)`);
    save();render();toast('환불 처리 — 정산 기준액에서 차감됨');
  },
  runSettle(cid){
    const c=camp(cid),k=calc(c),p=prod(c.productId);
    c.status='SETTLED';c.settledAt=ymd(today());
    D_().settlements.push({at:ymd(today()),title:`${p.name} · ${seller(c.sellerId).handle}`,net:k.net,brandPay:k.brandPay,sellerPay:k.sfTotal*(1-WHT),platFee:k.pf});
    if(k.refReward>0){
      const refId=seller(c.sellerId).referredBy;
      (D_().refEarnings=D_().refEarnings||[]).push({at:ymd(today()),referrerId:refId,fromSellerId:c.sellerId,campaignId:cid,amt:k.refReward});
      pushSys(cid,`추천 보상 지급 — 추천인 ${seller(refId).name}에게 확정 매출의 2% ₩${fmt(k.refReward)} (플랫폼 부담)`);
    }
    pushSys(cid,`<b>정산 완료</b> · 브랜드 ₩${fmt(k.brandPay)} · 셀러 ₩${fmt(k.sfTotal)}${k.rb?' (추천 부스트 +1%p 포함)':''} → 원천징수 3.3% 공제 후 ₩${fmt(k.sfTotal*(1-WHT))} · 명세 발행`);
    save();render();toast('정산 실행 완료 — 양측 지급 및 명세 발행');
  },
  approveProduct(pid){const p=prod(pid);p.status='listed';p.stock=p.stock||500;save();render();toast(`${p.name} 노출 승인`);},
  rejectProduct(pid){const p=prod(pid);D_().products=D_().products.filter(x=>x.id!==pid);save();render();toast('반려 처리');},
  newProduct(){productModal();},
  createProduct(){
    const nm=$('#npName').value.trim();if(!nm){toast('상품명을 입력하세요');return;}
    const exg=$('#npExcl').value;
    D_().products.push({id:'p'+(D_().seq++),brandId:S.actingBrand,name:nm,desc:$('#npDesc').value.trim()||'—',em:'📦',cat:$('#npCat').value||'건기식',
      thumb:NP.thumb||null,imgs:NP.imgs.slice(0,4),
      cp:+$('#npCp').value||0,gp:+$('#npGp').value||0,rate:(+$('#npRate').value||20)/100,sample:$('#npSample').value||'무상 1개',stock:+$('#npStock').value||0,status:'pending',
      ...(exg?{exclusive:{grade:exg,label:$('#npExclLabel').value.trim()||exg+' 등급 독점권'}}:{})});
    NP={thumb:null,imgs:[]};
    closeModal();save();render();toast('검수 요청 완료 — 관리자 승인 후 노출');
  },
  npThumbPick(){
    let inp=document.getElementById('npThumbFile');
    if(!inp){
      inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.id='npThumbFile';inp.hidden=true;
      document.body.appendChild(inp);
      inp.addEventListener('change',()=>{
        const f=inp.files[0];if(!f)return;
        fileToDataURL(f,360,url=>{NP.thumb=url;
          const el=$('#npThumbInfo');if(el)el.innerHTML=`✓ 첨부됨 <img src="${url}" alt="" style="height:28px;vertical-align:middle;margin-left:6px;border:1px solid var(--soft-line)">`;});
        inp.value='';
      });
    }
    inp.click();
  },
  npImgPick(){
    let inp=document.getElementById('npImgFile');
    if(!inp){
      inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.id='npImgFile';inp.hidden=true;
      document.body.appendChild(inp);
      inp.addEventListener('change',()=>{
        [...inp.files].slice(0,4-NP.imgs.length).forEach(f=>fileToDataURL(f,700,url=>{
          NP.imgs.push(url);
          const el=$('#npImgInfo');if(el)el.textContent=`${NP.imgs.length}장 첨부됨`;
        }));
        inp.value='';
      });
    }
    inp.click();
  },
  preview(cid){previewModal(cid);},
  copyLink(url){
    try{navigator.clipboard.writeText('https://'+url);toast('링크 복사됨');}catch(e){toast('복사 실패 — 수동으로 복사해주세요');}
  },
  sendChat(cid){
    const inp=$('#chatIn');const t=inp.value.trim();if(!t)return;
    pushChat(cid,S.view.role==='brand'?'brand':'seller',t);
    save();render();
  }
};
function simSell(cid,n){
  const c=camp(cid),p=prod(c.productId);
  const names=['김*은','이*아','박*희','최*진','정*수','한*별','윤*서','장*미'];
  for(let i=0;i<n;i++){
    D_().orders.push({id:'o'+(D_().seq++),campaignId:cid,buyer:names[Math.floor(Math.random()*8)],
      qty:Math.random()<.25?2:1,unit:p.gp,status:'PAID',at:ymd(today())});
  }
  save();render();toast(`주문 ${n}건 발생 (시뮬레이션)`);
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('modal-bg')){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.k,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('select[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.value,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatIn'){const b=document.querySelector('[data-act="sendChat"]');if(b)b.click();}
  if(e.key==='Escape')closeModal();
});
render();
</script>
